<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Image Generator (Puter + Marya Hosting)</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1e1e1e; color: white; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { color: #ffeb3b; margin-top: 15px; }
        #result a { color: #00e5ff; }
    </style>
</head>
<body>

    <h2>AI Generator & Direct Uploader</h2>
    <p>Model: FLUX.2 Pro (Puter AI)</p>
    
    <input type="text" id="promptBox" placeholder="Enter prompt (e.g. futuristic city in rain)">
    <button onclick="generateAndUpload()">Generate & Upload</button>

    <div id="status"></div>
    <div id="result" style="margin-top: 20px;"></div>

    <script>
        async function generateAndUpload() {
            const prompt = document.getElementById('promptBox').value;
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            if(!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            status.innerHTML = "1. AI Image Generate kar raha hai (FLUX.2 Pro)... Please wait ⏳";
            result.innerHTML = "";

            try {
                // 1. Puter AI se High-Quality Image Generate karna
                const imgElement = await puter.ai.txt2img(prompt, { model: "black-forest-labs/flux-2-pro" });
                
                status.innerHTML = "2. Image ban gayi! Ab Marya Hosting par Upload ho rahi hai... 🚀";
                
                // Puter jo image deta hai usko file/blob me convert karna
                const imageResponse = await fetch(imgElement.src);
                const imageBlob = await imageResponse.blob();

                // 2. Marya Hosting par Upload karna
                const formData = new FormData();
                formData.append("file", imageBlob, `puter_ai_${Date.now()}.jpg`);

                const uploadRes = await fetch("https://marya-hosting.pages.dev/upload", {
                    method: "POST",
                    body: formData
                });

                const uploadData = await uploadRes.json();
                
                // Direct stream URL nikalna
                const finalLink = uploadData?.urls?.stream || uploadData.url;

                // 3. Final URL aur Image Dikhana
                status.innerHTML = "✅ Success! Ye raha aapka Direct Link:";
                result.innerHTML = `
                    <p><b>Link:</b> <a href="${finalLink}" target="_blank">${finalLink}</a></p>
                    <img src="${finalLink}" style="max-width: 500px; border-radius: 10px; border: 2px solid #555;">
                `;

            } catch (err) {
                status.innerHTML = "❌ Error: " + err.message;
            }
        }
    </script>
</body>
</html>
