<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<title>NexaGram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#0d1724;
  --bg1:#111f30;
  --bg2:#162030;
  --bg3:#1a2840;
  --border:#243450;
  --text:#e8edf5;
  --muted:#7a92b0;
  --muted2:#4a6080;
  --accent:#3a7bd5;
  --accentD:#2a5da8;
  --green:#2ecc71;
  --red:#e74c3c;
  --redD:#8b1a1a;
  --bme:#1e4a7a;
  --bother:#1a2c42;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --surface:#1d2a39;
  --shadow:rgba(0,0,0,0.5);
  --ring:rgba(82,136,193,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;resize:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:2px}

/* ── TOASTS ── */
#TOAST{position:fixed;top:calc(var(--safe-t) + 12px);right:12px;z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;max-width:280px;box-shadow:0 4px 20px var(--shadow);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;pointer-events:all}
.toast.err{border-color:var(--red);color:#f99}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

/* ── CONNECTIVITY BANNER ── */
#CONN{position:fixed;top:0;left:0;right:0;z-index:1500;background:linear-gradient(90deg,#7b1c1c,#c0392b);color:#fff;font-size:13px;font-weight:600;text-align:center;padding:8px 12px;cursor:pointer;display:none;animation:connSlide .4s ease}
#CONN.show{display:block}
@keyframes connSlide{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* ── APP SHELL ── */
#APP{display:flex;height:100%;padding-top:var(--safe-t)}
#SIDE{width:320px;min-width:280px;max-width:340px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg1);transition:transform .25s ease}
#MAIN{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* ── AUTH ── */
#AUTH{display:flex;align-items:center;justify-content:center;height:100%;padding:20px}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 40px var(--shadow)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.auth-logo .icon-wrap{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accentD));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(58,123,213,.45)}
.auth-logo h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.auth-logo span{color:var(--accent)}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border-radius:7px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer}
.auth-tab.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(58,123,213,.4)}
.auth-field{position:relative;margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.auth-field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-size:14px;transition:border .2s,box-shadow .2s}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.auth-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accentD));color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:10px;margin-top:8px;transition:opacity .2s,transform .1s;box-shadow:0 4px 16px rgba(58,123,213,.35)}
.auth-btn:active{transform:scale(.98);opacity:.9}
.auth-err{color:#f99;font-size:13px;text-align:center;margin-top:10px;display:none}

/* ── SIDEBAR HEADER ── */
#sHd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border);background:rgba(13,23,36,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#sHd .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;cursor:pointer;border:2px solid var(--border);transition:border-color .2s}
#sHd .av:hover{border-color:var(--accent)}
#sHd .uname{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sHd .hbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:15px}
#sHd .hbtn:hover{background:var(--surface);color:var(--text)}

/* ── SEARCH ── */
#sSearch{padding:8px 12px;border-bottom:1px solid var(--border)}
#sSearch .wrap{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;transition:border .2s,box-shadow .2s}
#sSearch .wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#sSearch .wrap i{color:var(--muted);font-size:13px}
#srchIn{flex:1;font-size:13px}
#srchIn::placeholder{color:var(--muted2)}
#srchRes{padding:4px 8px;max-height:180px;overflow-y:auto}
.srch-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;transition:background .15s}
.srch-item:hover{background:var(--surface)}
.srch-item .sav{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.srch-item .sname{font-size:13px;font-weight:600}
.srch-item .sdesc{font-size:11px;color:var(--muted)}

/* ── TABS ── */
#sTabs{display:flex;padding:6px 8px;gap:4px;border-bottom:1px solid var(--border);background:var(--bg1)}
.stab{flex:1;padding:7px 4px;border-radius:8px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer;position:relative}
.stab.act{background:var(--surface);color:var(--accent)}
.stab .tbadge{position:absolute;top:3px;right:6px;background:var(--red);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px}

/* ── LIST ── */
#LIST{flex:1;overflow-y:auto;padding:4px}
.li{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative}
.li:hover{background:var(--surface)}
.li.act{background:var(--bg3);border:1px solid var(--border)}
.li .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;position:relative}
.li .av.ch{border-radius:12px;background:linear-gradient(135deg,#2e86ab,#1a5272)}
.li .info{flex:1;min-width:0}
.li .lname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.li .ltime{font-size:10px;color:var(--muted2);flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.li .ltime .ts{white-space:nowrap}
/* unread badge */
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg1);flex-shrink:0}
.unread-badge{background:var(--green);color:#fff;font-size:9px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.li.unread .lname{font-weight:700}
.li.unread .lsub{color:var(--text)}

/* ── MAIN HEADER ── */
#mHd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(13,23,36,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0;min-height:60px}
#mHd .back{display:none;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:background .2s}
#mHd .back:hover{background:var(--surface)}
#mHd .av2{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
#mHd .av2.ch{border-radius:10px;background:linear-gradient(135deg,#2e86ab,#1a5272)}
#mHd .info2{flex:1;min-width:0}
#mHd .info2 .n2{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mHd .info2 .s2{font-size:11px;color:var(--muted)}
#mHd .hbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:15px}
#mHd .hbtn:hover{background:var(--surface);color:var(--text)}

/* ── PLACEHOLDER ── */
#PH{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:12px}
#PH .icon{width:72px;height:72px;border-radius:20px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted2)}
#PH p{font-size:15px}

/* ── MESSAGES ── */
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;position:relative}
.bub{max-width:72%;display:flex;flex-direction:column;gap:3px;animation:bubIn .22s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.ot{align-self:flex-start;align-items:flex-start}
.bub .bsender{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.bub .bcont{background:var(--bother);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;line-height:1.5;position:relative;word-break:break-word}
.bub.me .bcont{background:var(--bme);border-radius:16px 16px 4px 16px}
.bub.pending .bcont{opacity:.65}
.bub.failed .bcont{background:var(--redD);border:1px solid var(--red)}
.bub .btime{font-size:10px;color:var(--muted);margin-top:1px}
.bub .retry{color:var(--accent);cursor:pointer;font-weight:600;margin-left:4px}
.bub .retry:hover{text-decoration:underline}
.bub .brep{background:rgba(0,0,0,.2);border-left:3px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);margin-bottom:5px;cursor:pointer;transition:background .15s,transform .15s;max-width:100%}
.bub .brep:hover{background:rgba(58,123,213,.15);transform:translateY(-1px)}
.bub .bimg{max-width:260px;max-height:220px;border-radius:10px;object-fit:cover;cursor:pointer;transition:transform .2s;display:block}
.bub .bimg:hover{transform:scale(1.02)}
.bub .breact{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bub .react-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;transition:background .15s}
.bub .react-btn:hover{background:rgba(58,123,213,.2)}
.react-picker{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;gap:6px;z-index:100;box-shadow:0 8px 24px var(--shadow);animation:bubIn .15s ease}
.react-pick-em{font-size:20px;cursor:pointer;transition:transform .15s}
.react-pick-em:hover{transform:scale(1.3)}
.dayDiv{text-align:center;margin:8px 0}
.dayDiv span{background:var(--bg3);color:var(--muted);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border)}

/* ── REPLY STRIP ── */
#repStrip{display:none;align-items:center;gap:10px;padding:8px 16px;background:var(--bg3);border-top:1px solid var(--border);font-size:13px}
#repStrip .rtxt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#repStrip .rtxt strong{color:var(--text)}
#repStrip button{color:var(--muted);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:background .15s}
#repStrip button:hover{background:var(--surface)}

/* ── INPUT BAR ── */
#inputBar{padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.ibar-inner{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 14px;transition:border .2s,box-shadow .2s}
.ibar-inner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#msgIn{flex:1;max-height:140px;overflow-y:auto;font-size:14px;line-height:1.5;padding:2px 0}
#msgIn::placeholder{color:var(--muted2)}
.ibar-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:16px;flex-shrink:0}
.ibar-btn:hover{background:var(--surface);color:var(--text)}
.ibar-send{background:var(--accent);color:#fff;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:background .2s,transform .1s;box-shadow:0 2px 8px rgba(58,123,213,.4)}
.ibar-send:hover{background:var(--accentD)}
.ibar-send:active{transform:scale(.95)}
#fileIn{display:none}

/* ── CHANNEL CREATE / INFO PANELS ── */
#chanPane,#profPane{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#chanPane.show,#profPane.show{display:flex}
.pane-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:380px;padding:28px 24px;box-shadow:0 12px 48px var(--shadow)}
.pane-box h3{font-size:17px;font-weight:700;margin-bottom:18px}
.pane-field{margin-bottom:14px}
.pane-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.pane-field input,.pane-field textarea,.pane-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--text);transition:border .2s,box-shadow .2s}
.pane-field input:focus,.pane-field textarea:focus,.pane-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);outline:none}
.pane-field textarea{resize:vertical;min-height:72px}
.pane-row{display:flex;gap:10px;margin-top:4px}
.pane-btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;transition:opacity .2s}
.pane-btn.prim{background:var(--accent);color:#fff}
.pane-btn.sec{background:var(--bg3);color:var(--muted)}

/* ── LIGHTBOX (A1) ── */
#LB{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
#LB.show{display:flex}
#LB .lb-img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:10px;transition:transform .2s;touch-action:pinch-zoom}
#LB .lb-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;transition:background .2s}
#LB .lb-close:hover{background:rgba(255,255,255,.2)}
#LB .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;transition:background .2s}
#LB .lb-nav:hover{background:rgba(255,255,255,.18)}
#LB .lb-prev{left:12px}
#LB .lb-next{right:12px}
#LB .lb-caption{color:rgba(255,255,255,.5);font-size:12px;margin-top:10px}

/* ── DRAG OVERLAY (A2) ── */
#DRAGOV{position:fixed;inset:0;z-index:1050;background:rgba(13,23,36,.85);display:none;align-items:center;justify-content:center;border:3px dashed var(--accent);pointer-events:none}
#DRAGOV.show{display:flex}
#DRAGOV>div{text-align:center;color:var(--accent);font-size:15px;font-weight:700}
#DRAGOV>div i{font-size:48px;margin-bottom:12px;display:block}
body.drag-active #DRAGOV{display:flex}

/* ── REP-JUMP PILL (A8) ── */
.repjump{position:sticky;top:6px;z-index:50;align-self:center;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);cursor:pointer;box-shadow:0 2px 10px var(--shadow);transition:background .2s,color .2s;animation:bubIn .2s ease;margin-bottom:4px}
.repjump:hover{background:var(--surface);color:var(--text)}

/* ── MEMBERS PANEL ── */
#membersPane{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#membersPane.show{display:flex}
#membersPane .pane-box{max-height:80vh;overflow-y:auto}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border:none}
.member-row .mav{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.member-row .mname{flex:1;font-size:14px;font-weight:600}
.member-row .mrole{font-size:11px;color:var(--accent);font-weight:700}

/* ── MOBILE ── */
@media(max-width:680px){
  #SIDE{position:fixed;inset:0;width:100%;z-index:200;transform:translateX(0);transition:transform .25s ease}
  #SIDE.hide{transform:translateX(-100%)}
  #MAIN{position:fixed;inset:0}
  #mHd .back{display:flex}
  #APP{position:relative}
}
</style>
</head>
<body>

<div id="CONN" onclick="ng_connRetry()">No connection — tap to retry</div>
<div id="TOAST"></div>

<!-- ── LIGHTBOX ── -->
<div id="LB">
  <div class="lb-close" onclick="ng_closeLightbox()"><i class="fas fa-times"></i></div>
  <div class="lb-nav lb-prev" onclick="ng_prevImg()"><i class="fas fa-chevron-left"></i></div>
  <img class="lb-img" id="LB_IMG" src="" alt=""/>
  <div class="lb-nav lb-next" onclick="ng_nextImg()"><i class="fas fa-chevron-right"></i></div>
  <div class="lb-caption" id="LB_CAP"></div>
</div>

<!-- ── DRAG OVERLAY ── -->
<div id="DRAGOV">
  <div>
    <i class="fas fa-cloud-upload-alt"></i>
    Drop to upload
  </div>
</div>

<!-- ── AUTH ── -->
<div id="AUTH">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon-wrap"><i class="fas fa-paper-plane"></i></div>
      <h1>Nexa<span>Gram</span></h1>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab act" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
      <div class="auth-tab" id="tabReg" onclick="switchAuthTab('reg')">Register</div>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>Username</label><input id="inUser" placeholder="your_username" autocomplete="username"/></div>
      <div class="auth-field"><label>Password</label><input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="auth-btn" onclick="doLogin()">Sign In</button>
    </div>
    <div id="regForm" style="display:none">
      <div class="auth-field"><label>Username</label><input id="inRegUser" placeholder="choose_username" autocomplete="username"/></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────
var BACKEND  = 'https://marya-hosting.pages.dev';
var CHAT_API = BACKEND + '/btfstorage/chat';
var UPLOAD_API = BACKEND + '/upload';

// ── STATE ──────────────────────────────────────────────────────────────────
var ME = null;
var curChat = null;      // {type:'dm'|'channel', id, name, ...}
var curTab = 'dm';
var replyD = null;       // {id, sender, text}
var pollTimer = null;
var pollInterval = 1500;
var pollStreak = 0;
var pendingMsgs = {};    // tmpId -> {body, chatSnapshot}
var LR = {};             // chatKey -> lastReadId
var lbImgs = [];         // lightbox image list
var lbIdx = 0;
var dragCounter = 0;
var jumpPillTimer = null;
var draftDebounce = null;
var dmList = [];
var chList = [];

// ── UTILITIES ──────────────────────────────────────────────────────────────
function g(id){ return document.getElementById(id); }
function qs(sel,ctx){ return (ctx||document).querySelector(sel); }
function qsa(sel,ctx){ return (ctx||document).querySelectorAll(sel); }
function toast(msg,err){
  var d=document.createElement('div');
  d.className='toast'+(err?' err':'');
  d.textContent=msg;
  g('TOAST').appendChild(d);
  setTimeout(function(){d.remove();},3000);
}
function fmtTime(ts){
  if(!ts)return'';
  var d=new Date(ts);
  var now=new Date();
  var diff=now-d;
  if(diff<86400000){
    return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fmtDay(ts){
  var d=new Date(ts);
  var now=new Date();
  var diff=Math.floor((now-d)/86400000);
  if(diff===0)return'Today';
  if(diff===1)return'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
}
function initials(name){
  if(!name)return'?';
  var parts=name.trim().split(/\s+/);
  return(parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function chatKey(){
  if(!curChat)return'';
  return(curChat.type==='dm'?'d':'c')+curChat.id;
}
function ls_get(k){
  try{
    var raw=localStorage.getItem(k);
    if(!raw)return null;
    var o=JSON.parse(raw);
    if(o.exp&&Date.now()>o.exp){localStorage.removeItem(k);return null;}
    return o.v;
  }catch(e){return null;}
}
function ls_set(k,v,ttl){
  try{
    var o={v:v};
    if(ttl)o.exp=Date.now()+ttl;
    localStorage.setItem(k,JSON.stringify(o));
  }catch(e){}
}
function ls_rm(k){try{localStorage.removeItem(k);}catch(e){}}

// ── API ────────────────────────────────────────────────────────────────────
var _netFailed=false;
function api(action,body,noAuth){
  var headers={'Content-Type':'application/json'};
  var tok=localStorage.getItem('ng_tok');
  if(!noAuth&&tok)headers['X-Session-Token']=tok;
  var payload=Object.assign({action:action},body||{});
  return fetch(CHAT_API,{
    method:'POST',
    headers:headers,
    body:JSON.stringify(payload)
  }).then(function(r){
    if(r.status===401){
      return null;
    }
    return r.json();
  }).then(function(data){
    if(_netFailed){
      _netFailed=false;
      g('CONN').classList.remove('show');
    }
    ng_updateBackoff(true);
    return data;
  }).catch(function(e){
    _netFailed=true;
    g('CONN').classList.add('show');
    ng_updateBackoff(false);
    return {success:false,error:'network',_net:true};
  });
}

// ── CONNECTIVITY ───────────────────────────────────────────────────────────
function ng_connRetry(){
  api('me').then(function(r){
    if(r&&r.success){
      g('CONN').classList.remove('show');
      _netFailed=false;
      loadList();
    }else{
      toast('Still offline',true);
    }
  });
}

// ── BACKOFF POLLING ────────────────────────────────────────────────────────
function ng_updateBackoff(success){
  if(success){
    pollStreak++;
    if(pollStreak>=10)pollInterval=15000;
    else if(pollStreak>=3)pollInterval=5000;
    else pollInterval=1500;
  }else{
    pollStreak=0;
    pollInterval=1500;
  }
}

function startPoll(){
  stopPoll();
  (function tick(){
    if(document.hidden){pollTimer=setTimeout(tick,pollInterval);return;}
    var p=curChat?loadMessages(true):loadList();
    p.then(function(){
      pollTimer=setTimeout(tick,pollInterval);
    }).catch(function(){
      ng_updateBackoff(false);
      pollTimer=setTimeout(tick,pollInterval);
    });
  })();
}
function stopPoll(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&ME)startPoll();
  else stopPoll();
});

// ── AUTH ───────────────────────────────────────────────────────────────────
function switchAuthTab(t){
  g('tabLogin').classList.toggle('act',t==='login');
  g('tabReg').classList.toggle('act',t==='reg');
  g('loginForm').style.display=t==='login'?'':'none';
  g('regForm').style.display=t==='reg'?'':'none';
  g('authErr').style.display='none';
}
function showAuthErr(msg){
  var el=g('authErr');
  el.textContent=msg;
  el.style.display='block';
}
function doLogin(){
  var u=g('inUser').value.trim();
  var p=g('inPass').value;
  if(!u||!p){showAuthErr('Fill all fields.');return;}
  api('login',{username:u,password:p},true).then(function(r){
    if(!r){showAuthErr('Session error.');return;}
    if(!r.success){showAuthErr(r.error||'Login failed.');return;}
    if(!r.token||!r.user){showAuthErr('Invalid server response.');return;}
    localStorage.setItem('ng_tok',r.token);
    ME=r.user;
    onLoggedIn();
  });
}
function doRegister(){
  var u=g('inRegUser').value.trim();
  var n=g('inRegName').value.trim();
  var p=g('inRegPass').value;
  if(!u||!n||!p){showAuthErr('Fill all fields.');return;}
  api('register',{username:u,display_name:n,password:p},true).then(function(r){
    if(!r){showAuthErr('Session error.');return;}
    if(!r.success){showAuthErr(r.error||'Registration failed.');return;}
    if(!r.token||!r.user){showAuthErr('Invalid server response.');return;}
    localStorage.setItem('ng_tok',r.token);
    ME=r.user;
    onLoggedIn();
  });
}
function doLogout(){
  localStorage.removeItem('ng_tok');
  ME=null;curChat=null;dmList=[];chList=[];
  stopPoll();
  g('AUTH').style.display='flex';
  g('APP').style.display='none';
}
function onLoggedIn(){
  g('AUTH').style.display='none';
  g('APP').style.display='flex';
  if(!ME||!ME.display_name){ME=ME||{};ME.display_name=ME.username||'Me';}
  g('myName').textContent=ME.display_name;
  g('myAv').textContent=initials(ME.display_name);
  // load saved LR
  try{var saved=localStorage.getItem('ngr_LR');if(saved)LR=JSON.parse(saved);}catch(e){}
  loadList();
  startPoll();
}
function tryAutoLogin(){
  var tok=localStorage.getItem('ng_tok');
  if(!tok)return;
  api('me').then(function(r){
    if(r&&r.success&&r.user){
      ME=r.user;
      onLoggedIn();
    }
  });
}

// ── LIST ───────────────────────────────────────────────────────────────────
function loadList(){
  var p=curTab==='dm'?loadDMList():loadChannelList();
  return p;
}
function switchTab(t){
  curTab=t;
  g('tabDM').classList.toggle('act',t==='dm');
  g('tabCH').classList.toggle('act',t==='ch');
  loadList();
}
function loadDMList(){
  return api('list_chats').then(function(r){
    if(!r||r._net)return;
    if(r===null){doLogout();return;}
    if(!r.success)return;
    dmList=r.chats||[];
    renderList(dmList,'dm');
  });
}
function loadChannelList(){
  return api('list_channels').then(function(r){
    if(!r||r._net)return;
    if(r===null){doLogout();return;}
    if(!r.success)return;
    chList=r.channels||[];
    renderList(chList,'channel');
  });
}
function renderList(items,type){
  var el=g('LIST');
  el.innerHTML='';
  if(!items.length){
    el.innerHTML='<div style="color:var(--muted);text-align:center;padding:24px;font-size:13px">'+(type==='dm'?'No chats yet':'No channels yet')+'</div>';
    return;
  }
  items.forEach(function(item){
    var key=(type==='dm'?'d':'c')+item.id;
    var lastId=item.last_message_id||(item.messages&&item.messages.length?item.messages[item.messages.length-1].id:0)||0;
    var unread=LR[key]!==undefined&&lastId>LR[key];
    var div=document.createElement('div');
    div.className='li'+(curChat&&curChat.id===item.id&&curChat.type===type?' act':'')+(unread?' unread':'');
    div.setAttribute('data-key',key);
    var name=type==='dm'?(item.other_user_name||item.name||'Chat'):(item.name||'Channel');
    var sub=item.last_message_text||item.description||'';
    var ts=item.last_message_at||item.updated_at||'';
    var avClass='av'+(type==='channel'?' ch':'');
    var badge=unread?'<div class="unread-badge">!</div>':'';
    div.innerHTML=
      '<div class="'+avClass+'">'+initials(name)+'</div>'+
      '<div class="info">'+
        '<div class="lname">'+escHtml(name)+'</div>'+
        '<div class="lsub">'+escHtml(sub.substring(0,40))+'</div>'+
      '</div>'+
      '<div class="ltime">'+
        '<div class="ts">'+fmtTime(ts)+'</div>'+
        badge+
      '</div>';
    div.onclick=function(){openItem(item,type);};
    el.appendChild(div);
  });
}
function ng_renderUnread(){
  qsa('.li',g('LIST')).forEach(function(li){
    var key=li.getAttribute('data-key');
    if(!key)return;
    var items=curTab==='dm'?dmList:chList;
    var type=curTab==='dm'?'dm':'channel';
    var item=items.find(function(i){return(type==='dm'?'d':'c')+i.id===key;});
    if(!item)return;
    var lastId=item.last_message_id||0;
    var unread=LR[key]!==undefined&&lastId>LR[key];
    li.classList.toggle('unread',unread);
    var badge=li.querySelector('.unread-badge');
    if(unread&&!badge){
      var t=li.querySelector('.ltime');
      if(t){var b=document.createElement('div');b.className='unread-badge';b.textContent='!';t.appendChild(b);}
    }else if(!unread&&badge){badge.remove();}
  });
}
function ng_markRead(key,lastId){
  LR[key]=lastId;
  try{localStorage.setItem('ngr_LR',JSON.stringify(LR));}catch(e){}
  ng_renderUnread();
}

// ── OPEN CHAT / CHANNEL ────────────────────────────────────────────────────
function openItem(item,type){
  curChat={type:type,id:item.id,name:type==='dm'?(item.other_user_name||item.name):(item.name),data:item};
  replyD=null;
  g('repStrip').style.display='none';
  ng_restoreDraft();
  // update header
  g('CHAT').style.display='flex';
  g('PH').style.display='none';
  g('mHdAv').textContent=initials(curChat.name);
  g('mHdAv').className='av2'+(type==='channel'?' ch':'');
  g('mHdName').textContent=curChat.name;
  g('mHdSub').textContent=type==='channel'?'Channel':'Direct Message';
  // mark list active
  qsa('.li',g('LIST')).forEach(function(li){li.classList.remove('act');});
  var key=chatKey();
  var li=qs('[data-key="'+key+'"]',g('LIST'));
  if(li)li.classList.add('act');
  // mobile
  if(window.innerWidth<=680)g('SIDE').classList.add('hide');
  loadMessages();
}
function goBack(){
  if(window.innerWidth<=680)g('SIDE').classList.remove('hide');
  curChat=null;
  g('CHAT').style.display='none';
  g('PH').style.display='flex';
}
function openInfo(){
  if(!curChat)return;
  if(curChat.type==='channel')openMembersPane();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────
function loadMessages(silent){
  if(!curChat)return Promise.resolve();
  var snap=curChat;
  var key=chatKey();
  var action=curChat.type==='dm'?'get_messages':'get_channel_messages';
  var body=curChat.type==='dm'?{chat_id:curChat.id}:{channel_id:curChat.id};
  return api(action,body).then(function(r){
    if(!r||r._net)return;
    if(r===null){doLogout();return;}
    if(curChat!==snap)return; // guard stale
    if(!r.success)return;
    var msgs=r.messages||[];
    renderMessages(msgs);
    if(msgs.length){
      ng_markRead(key,msgs[msgs.length-1].id);
    }
  });
}
function renderMessages(msgs){
  var el=g('msgs');
  var atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;
  el.innerHTML='';
  var lastDay='';
  // collect images for lightbox
  lbImgs=[];
  msgs.forEach(function(m){
    var day=fmtDay(m.created_at);
    if(day!==lastDay){
      lastDay=day;
      var dd=document.createElement('div');
      dd.className='dayDiv';
      dd.innerHTML='<span>'+escHtml(day)+'</span>';
      el.appendChild(dd);
    }
    el.appendChild(buildBubble(m));
    if(m.media_url&&isImgUrl(m.media_url))lbImgs.push({src:m.media_url,id:m.id});
  });
  // add pending that are not yet confirmed
  Object.keys(pendingMsgs).forEach(function(tid){
    var pm=pendingMsgs[tid];
    if(pm.chatKey===chatKey()&&!el.querySelector('#'+tid)){
      el.appendChild(buildPendingBubble(tid,pm));
    }
  });
  if(atBottom)el.scrollTop=el.scrollHeight;
  attachBubEvts();
}
function buildBubble(m){
  var isMe=ME&&m.sender_id===ME.id;
  var wrap=document.createElement('div');
  wrap.className='bub '+(isMe?'me':'ot');
  wrap.setAttribute('data-id',m.id);
  var inner='';
  if(!isMe&&m.sender_name){
    inner+='<div class="bsender">'+escHtml(m.sender_name)+'</div>';
  }
  if(m.reply_to_id){
    inner+='<div class="brep" data-repid="'+m.reply_to_id+'">'
      +'<i class="fas fa-reply" style="font-size:10px;margin-right:4px"></i>'
      +escHtml((m.reply_to_sender||'')+(m.reply_to_text?': '+m.reply_to_text.substring(0,60):''))
      +'</div>';
  }
  inner+='<div class="bcont">';
  if(m.media_url){
    if(isImgUrl(m.media_url)){
      inner+='<img class="bimg" src="'+escHtml(m.media_url)+'" data-src="'+escHtml(m.media_url)+'"/>';
    }else{
      inner+='<a href="'+escHtml(m.media_url)+'" target="_blank" style="color:var(--accent)"><i class="fas fa-file"></i> Attachment</a>';
    }
  }
  if(m.content){inner+=escHtml(m.content);}
  inner+='</div>';
  // reactions
  var reacts=m.reactions||[];
  if(reacts.length){
    inner+='<div class="breact">';
    var rmap={};
    reacts.forEach(function(r){rmap[r.emoji]=(rmap[r.emoji]||0)+1;});
    Object.keys(rmap).forEach(function(em){
      inner+='<span class="react-btn" data-msgid="'+m.id+'" data-em="'+escHtml(em)+'">'+escHtml(em)+' '+rmap[em]+'</span>';
    });
    inner+='</div>';
  }
  inner+='<div class="btime">'+fmtTime(m.created_at)
    +' <span class="react-add" data-msgid="'+m.id+'" title="React"><i class="fas fa-smile" style="font-size:10px"></i></span>'
    +(isMe?' <span class="del-msg" data-msgid="'+m.id+'" title="Delete"><i class="fas fa-trash" style="font-size:10px;color:var(--muted)"></i></span>':'')
    +' <span class="rep-btn" data-msgid="'+m.id+'" data-sender="'+escHtml(m.sender_name||ME&&ME.display_name||'')+'" data-txt="'+escHtml((m.content||'').substring(0,80))+'" title="Reply"><i class="fas fa-reply" style="font-size:10px"></i></span>'
    +'</div>';
  wrap.innerHTML=inner;
  return wrap;
}
function buildPendingBubble(tid,pm){
  var wrap=document.createElement('div');
  wrap.className='bub me '+(pm.failed?'failed':'pending');
  wrap.id=tid;
  var inner='<div class="bcont">';
  if(pm.body.content)inner+=escHtml(pm.body.content);
  if(pm.body.media_url){
    if(isImgUrl(pm.body.media_url)){
      inner+='<img class="bimg" src="'+escHtml(pm.body.media_url)+'"/>';
    }
  }
  inner+='</div>';
  inner+='<div class="btime">'+(pm.failed?'Failed <span class="retry" onclick="retrySend(\''+tid+'\')">tap to retry</span>':'Sending...')+'</div>';
  wrap.innerHTML=inner;
  return wrap;
}
function attachBubEvts(){
  var el=g('msgs');
  // reply
  qsa('.rep-btn',el).forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      replyD={id:btn.getAttribute('data-msgid'),sender:btn.getAttribute('data-sender'),text:btn.getAttribute('data-txt')};
      g('repStrip').style.display='flex';
      g('repName').textContent=replyD.sender;
      g('repTxt').innerHTML='Replying to <strong>'+escHtml(replyD.sender)+'</strong>';
      g('msgIn').focus();
    };
  });
  // react add
  qsa('.react-add',el).forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      showReactPicker(btn.getAttribute('data-msgid'),btn);
    };
  });
  // react btn (add same)
  qsa('.react-btn',el).forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      sendReact(btn.getAttribute('data-msgid'),btn.getAttribute('data-em'));
    };
  });
  // delete
  qsa('.del-msg',el).forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      deleteMsg(btn.getAttribute('data-msgid'));
    };
  });
  // reply jump
  qsa('.brep',el).forEach(function(div){
    div.onclick=function(){scrollToMsg(div.getAttribute('data-repid'));};
  });
  // lightbox
  qsa('.bimg',el).forEach(function(img){
    img.onclick=function(){ng_openLightbox(img.getAttribute('src'),lbImgs);};
  });
}

// ── SEND ───────────────────────────────────────────────────────────────────
function sendMsg(){
  if(!curChat)return;
  var txt=g('msgIn').value.trim();
  if(!txt&&!pendingMsgs._pendingFile)return;
  var snap=curChat;
  var key=chatKey();
  var tmpId='tmp_'+Math.random().toString(36).slice(2);
  var body={};
  if(curChat.type==='dm')body.chat_id=curChat.id;
  else body.channel_id=curChat.id;
  if(txt)body.content=txt;
  if(replyD)body.reply_to_id=replyD.id;
  var savedReply=replyD;
  // optimistic
  pendingMsgs[tmpId]={body:body,chatKey:key,failed:false,replyD:savedReply};
  var pb=buildPendingBubble(tmpId,pendingMsgs[tmpId]);
  g('msgs').appendChild(pb);
  g('msgs').scrollTop=g('msgs').scrollHeight;
  // clear UI
  g('msgIn').value='';
  autoGrow(g('msgIn'));
  clearReply();
  ng_clearDraft();
  var action=curChat.type==='dm'?'send_message':'send_channel_message';
  api(action,body).then(function(r){
    if(!r||r._net){
      markFailed(tmpId,txt,savedReply);
      return;
    }
    if(r===null){doLogout();return;}
    if(!r.success){
      toast(r.error||'Send failed',true);
      markFailed(tmpId,txt,savedReply);
      return;
    }
    delete pendingMsgs[tmpId];
    if(curChat!==snap){
      toast('Message sent to '+snap.name);
      return;
    }
    loadMessages(true);
    loadList();
  });
}
function markFailed(tmpId,txt,savedReply){
  if(pendingMsgs[tmpId])pendingMsgs[tmpId].failed=true;
  var el=g(tmpId);
  if(el){
    el.classList.remove('pending');
    el.classList.add('failed');
    var bt=el.querySelector('.btime');
    if(bt)bt.innerHTML='Failed <span class="retry" onclick="retrySend(\''+tmpId+'\')">tap to retry</span>';
  }
  // restore text if not already typed something else
  if(txt&&!g('msgIn').value.trim()){
    g('msgIn').value=txt;
    autoGrow(g('msgIn'));
  }
  if(savedReply&&!replyD){
    replyD=savedReply;
    g('repStrip').style.display='flex';
    g('repName').textContent=replyD.sender;
  }
}
function retrySend(tmpId){
  var pm=pendingMsgs[tmpId];
  if(!pm)return;
  if(!curChat||chatKey()!==pm.chatKey){toast('Switch back to retry');return;}
  pm.failed=false;
  var el=g(tmpId);
  if(el){el.classList.remove('failed');el.classList.add('pending');var bt=el.querySelector('.btime');if(bt)bt.textContent='Sending...';}
  var snap=curChat;
  var action=curChat.type==='dm'?'send_message':'send_channel_message';
  api(action,pm.body).then(function(r){
    if(!r||r._net){pm.failed=true;var el=g(tmpId);if(el){el.classList.remove('pending');el.classList.add('failed');var bt=el.querySelector('.btime');if(bt)bt.innerHTML='Failed <span class="retry" onclick="retrySend(\''+tmpId+'\')">tap to retry</span>';}return;}
    if(!r.success){toast(r.error||'Retry failed',true);pm.failed=true;return;}
    delete pendingMsgs[tmpId];
    if(curChat!==snap){toast('Message sent to '+snap.name);return;}
    loadMessages(true);loadList();
  });
}
function deleteMsg(id){
  if(!curChat)return;
  var action=curChat.type==='dm'?'delete_message':'delete_channel_message';
  var body=curChat.type==='dm'?{message_id:id}:{message_id:id};
  api(action,body).then(function(r){
    if(!r)return;
    if(r.success)loadMessages(true);
    else toast(r.error||'Cannot delete',true);
  });
}

// ── REACTIONS ─────────────────────────────────────────────────────────────
var EMOJIS=['👍','❤️','😂','😮','😢','🔥'];
function showReactPicker(msgId,anchor){
  qsa('.react-picker').forEach(function(p){p.remove();});
  var picker=document.createElement('div');
  picker.className='react-picker';
  EMOJIS.forEach(function(em){
    var s=document.createElement('span');
    s.className='react-pick-em';
    s.textContent=em;
    s.onclick=function(){picker.remove();sendReact(msgId,em);};
    picker.appendChild(s);
  });
  anchor.appendChild(picker);
  setTimeout(function(){document.addEventListener('click',function h(){picker.remove();document.removeEventListener('click',h);},{once:true});},50);
}
function sendReact(msgId,emoji){
  if(!curChat)return;
  var action=curChat.type==='dm'?'react_message':'react_channel_message';
  var body={message_id:msgId,emoji:emoji};
  api(action,body).then(function(r){if(r&&r.success)loadMessages(true);});
}

// ── REPLY ─────────────────────────────────────────────────────────────────
function clearReply(){
  replyD=null;
  g('repStrip').style.display='none';
}
function scrollToMsg(id){
  var el=g('msgs').querySelector('[data-id="'+id+'"]');
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--accent)';setTimeout(function(){el.style.outline='';},1500);}
  else{ng_showJumpPill(id);}
}
function ng_showJumpPill(id){
  ng_hideJumpPill();
  var pill=document.createElement('div');
  pill.className='repjump';
  pill.id='REPJUMP';
  pill.textContent='↞ Jump to replied message';
  pill.onclick=function(){ng_hideJumpPill();};
  g('msgs').insertBefore(pill,g('msgs').firstChild);
  jumpPillTimer=setTimeout(ng_hideJumpPill,6000);
}
function ng_hideJumpPill(){
  if(jumpPillTimer){clearTimeout(jumpPillTimer);jumpPillTimer=null;}
  var p=g('REPJUMP');if(p)p.remove();
}

// ── SCROLL ────────────────────────────────────────────────────────────────
function onMsgsScroll(){}

// ── FILE / UPLOAD ──────────────────────────────────────────────────────────
function onFileInput(inp){
  if(!inp.files||!inp.files[0])return;
  onFile(inp.files[0]);
  inp.value='';
}
function onFile(file){
  if(!curChat){toast('Open a chat first',true);return;}
  var snap=curChat;
  var formData=new FormData();
  formData.append('file',file);
  var tok=localStorage.getItem('ng_tok');
  var headers={};
  if(tok)headers['X-Session-Token']=tok;
  toast('Uploading…');
  fetch(UPLOAD_API,{method:'POST',headers:headers,body:formData})
    .then(function(r){return r.json();})
    .then(function(r){
      if(!r||!r.success){toast(r&&r.error||'Upload failed',true);return;}
      var url=r.url||r.file_url||r.path;
      if(!url){toast('No URL returned',true);return;}
      if(curChat!==snap){toast('Upload done but chat switched');return;}
      var key=chatKey();
      var tmpId='tmp_'+Math.random().toString(36).slice(2);
      var body={};
      if(curChat.type==='dm')body.chat_id=curChat.id;
      else body.channel_id=curChat.id;
      body.media_url=url;
      pendingMsgs[tmpId]={body:body,chatKey:key,failed:false};
      var pb=buildPendingBubble(tmpId,pendingMsgs[tmpId]);
      g('msgs').appendChild(pb);
      g('msgs').scrollTop=g('msgs').scrollHeight;
      var action=curChat.type==='dm'?'send_message':'send_channel_message';
      api(action,body).then(function(r2){
        delete pendingMsgs[tmpId];
        if(!r2||!r2.success){toast(r2&&r2.error||'Send failed',true);return;}
        if(curChat!==snap)return;
        loadMessages(true);loadList();
      });
    })
    .catch(function(){toast('Upload error',true);});
}

// ── DRAG AND DROP (A2) ─────────────────────────────────────────────────────
function ng_onDrop(e){
  e.preventDefault();
  dragCounter=0;
  document.body.classList.remove('drag-active');
  var files=e.dataTransfer.files;
  if(files&&files.length)onFile(files[0]);
}
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('dragenter',function(e){
  dragCounter++;
  document.body.classList.add('drag-active');
});
document.addEventListener('dragleave',function(e){
  dragCounter--;
  if(dragCounter<=0){dragCounter=0;document.body.classList.remove('drag-active');}
});
document.addEventListener('drop',ng_onDrop);

// ── PASTE TO UPLOAD (A3) ───────────────────────────────────────────────────
function ng_onPaste(e){
  var items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image/')===0){
      var file=items[i].getAsFile();
      if(file){e.preventDefault();onFile(file);return;}
    }
  }
}
document.addEventListener('paste',ng_onPaste);

// ── DRAFT (B1) ─────────────────────────────────────────────────────────────
function onDraftChange(){
  if(draftDebounce)clearTimeout(draftDebounce);
  draftDebounce=setTimeout(ng_saveDraft,400);
}
function ng_saveDraft(){
  var key='ngd_'+chatKey();
  var txt=g('msgIn').value;
  if(!txt&&!replyD){ls_rm(key);return;}
  ls_set(key,{txt:txt,replyId:replyD?replyD.id:null,replyD:replyD},86400000);
}
function ng_restoreDraft(){
  var key='ngd_'+chatKey();
  var d=ls_get(key);
  if(!d){g('msgIn').value='';autoGrow(g('msgIn'));return;}
  g('msgIn').value=d.txt||'';
  autoGrow(g('msgIn'));
  if(d.replyD){
    replyD=d.replyD;
    g('repStrip').style.display='flex';
    g('repName').textContent=replyD.sender||'';
    g('repTxt').innerHTML='Replying to <strong>'+escHtml(replyD.sender||'')+'</strong>';
  }
}
function ng_clearDraft(){
  var key='ngd_'+chatKey();
  ls_rm(key);
}

// ── SEARCH ────────────────────────────────────────────────────────────────
var searchDebounce=null;
function onSearch(val){
  if(searchDebounce)clearTimeout(searchDebounce);
  if(!val.trim()){g('srchRes').innerHTML='';return;}
  searchDebounce=setTimeout(function(){doSearch(val.trim());},300);
}
function doSearch(q){
  api('search_users',{query:q}).then(function(r){
    if(!r||!r.success){g('srchRes').innerHTML='';return;}
    var users=r.users||[];
    var el=g('srchRes');
    el.innerHTML='';
    users.forEach(function(u){
      var d=document.createElement('div');
      d.className='srch-item';
      d.innerHTML='<div class="sav">'+initials(u.display_name)+'</div>'
        +'<div><div class="sname">'+escHtml(u.display_name)+'</div>'
        +'<div class="sdesc">@'+escHtml(u.username)+'</div></div>';
      d.onclick=function(){startDM(u);g('srchRes').innerHTML='';g('srchIn').value='';};
      el.appendChild(d);
    });
    if(!users.length)el.innerHTML='<div style="color:var(--muted);padding:8px;font-size:13px">No users found</div>';
  });
}
function startDM(user){
  api('create_chat',{user_id:user.id}).then(function(r){
    if(!r||!r.success){toast(r&&r.error||'Cannot start chat',true);return;}
    var chat=r.chat;
    chat.other_user_name=user.display_name;
    curTab='dm';
    g('tabDM').classList.add('act');
    g('tabCH').classList.remove('act');
    loadDMList().then(function(){openItem(chat,'dm');});
  });
}

// ── CHANNELS ──────────────────────────────────────────────────────────────
function openChanPane(){g('chanPane').classList.add('show');}
function closeChanPane(){g('chanPane').classList.remove('show');}
function submitChanCreate(){
  var name=g('chanName').value.trim();
  var desc=g('chanDesc').value.trim();
  var type=g('chanType').value;
  if(!name){toast('Channel name required',true);return;}
  api('create_channel',{name:name,description:desc,type:type}).then(function(r){
    if(!r||!r.success){toast(r&&r.error||'Failed',true);return;}
    closeChanPane();
    g('chanName').value='';g('chanDesc').value='';
    toast('Channel created!');
    curTab='ch';
    g('tabCH').classList.add('act');
    g('tabDM').classList.remove('act');
    loadChannelList();
  });
}
function openMembersPane(){
  if(!curChat||curChat.type!=='channel')return;
  api('channel_members',{channel_id:curChat.id}).then(function(r){
    var list=g('membersList');
    list.innerHTML='';
    if(!r||!r.success){list.innerHTML='<div style="color:var(--muted)">Failed to load</div>';return;}
    var members=r.members||[];
    members.forEach(function(m){
      var row=document.createElement('div');
      row.className='member-row';
      row.innerHTML='<div class="mav">'+initials(m.display_name||m.username||'?')+'</div>'
        +'<div class="mname">'+escHtml(m.display_name||m.username||'Unknown')+'</div>'
        +'<div class="mrole">'+escHtml(m.role||'member')+'</div>';
      list.appendChild(row);
    });
    // check membership
    var isMember=members.some(function(m){return ME&&m.user_id===ME.id;});
    g('joinLeaveBtn').textContent=isMember?'Leave':'Join';
    g('membersPane').classList.add('show');
  });
}
function closeMembersPane(){g('membersPane').classList.remove('show');}
function toggleJoinLeave(){
  if(!curChat||curChat.type!=='channel')return;
  var btn=g('joinLeaveBtn');
  var isLeave=btn.textContent==='Leave';
  var action=isLeave?'leave_channel':'join_channel';
  api(action,{channel_id:curChat.id}).then(function(r){
    if(!r||!r.success){toast(r&&r.error||'Failed',true);return;}
    toast(isLeave?'Left channel':'Joined channel!');
    btn.textContent=isLeave?'Join':'Leave';
    loadChannelList();
  });
}

// ── PROFILE ───────────────────────────────────────────────────────────────
function openProfPane(){
  if(!ME)return;
  g('profName').value=ME.display_name||'';
  g('profBio').value=ME.bio||'';
  g('profAvatar').value=ME.avatar_url||'';
  g('profPane').classList.add('show');
}
function closeProfPane(){g('profPane').classList.remove('show');}
function submitProfUpdate(){
  var body={display_name:g('profName').value.trim(),bio:g('profBio').value.trim(),avatar_url:g('profAvatar').value.trim()};
  api('update_profile',body).then(function(r){
    if(!r||!r.success){toast(r&&r.error||'Update failed',true);return;}
    ME=Object.assign(ME,body);
    g('myName').textContent=ME.display_name;
    g('myAv').textContent=initials(ME.display_name);
    closeProfPane();
    toast('Profile updated!');
  });
}

// ── LIGHTBOX (A1) ─────────────────────────────────────────────────────────
function ng_openLightbox(src,imgs){
  lbImgs=imgs||[];
  lbIdx=lbImgs.findIndex(function(i){return i.src===src;});
  if(lbIdx<0){lbIdx=0;lbImgs=[{src:src}];}
  ng_setLightboxImg();
  g('LB').classList.add('show');
}
function ng_setLightboxImg(){
  var img=lbImgs[lbIdx];
  if(!img)return;
  g('LB_IMG').src=img.src;
  g('LB_CAP').textContent=(lbIdx+1)+' / '+lbImgs.length;
}
function ng_closeLightbox(){
  g('LB').classList.remove('show');
  g('LB_IMG').src='';
}
function ng_prevImg(){
  if(lbImgs.length<2)return;
  lbIdx=(lbIdx-1+lbImgs.length)%lbImgs.length;
  ng_setLightboxImg();
}
function ng_nextImg(){
  if(lbImgs.length<2)return;
  lbIdx=(lbIdx+1)%lbImgs.length;
  ng_setLightboxImg();
}
g('LB').addEventListener('click',function(e){if(e.target===g('LB'))ng_closeLightbox();});
// keyboard
document.addEventListener('keydown',function(e){
  if(!g('LB').classList.contains('show'))return;
  if(e.key==='Escape')ng_closeLightbox();
  if(e.key==='ArrowLeft')ng_prevImg();
  if(e.key==='ArrowRight')ng_nextImg();
});

// ── MISC UI ───────────────────────────────────────────────────────────────
function autoGrow(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,140)+'px';
}
function onMsgKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
}
function escHtml(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isImgUrl(url){
  if(!url)return false;
  return /\.(jpg|jpeg|png|gif|webp|svg|bmp)(\?|$)/i.test(url)||url.startsWith('data:image');
}

// ── INIT ───────────────────────────────────────────────────────────────────
tryAutoLogin();
