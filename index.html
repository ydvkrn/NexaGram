<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NexaGram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#0d1724;--bg1:#111f30;--bg2:#162030;--bg3:#1a2840;--border:#243450;
  --text:#e8edf5;--muted:#7a92b0;--muted2:#4a6080;--accent:#3a7bd5;--accentD:#2a5da8;
  --green:#2ecc71;--red:#e74c3c;--redD:#8b1a1a;--bme:#1e4a7a;--bother:#1a2c42;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:2px}

#TOAST{position:fixed;top:12px;right:12px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,0.6);animation:toastIn .3s ease forwards;pointer-events:all}
.toast.err{border-left:3px solid var(--red);color:#ff6b6b}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

#AUTH{display:flex;align-items:center;justify-content:center;height:100%;padding:20px}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.5)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.auth-logo .icon-wrap{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accentD));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(58,123,213,0.4)}
.auth-logo h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.auth-logo span{color:var(--accent)}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border-radius:7px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer}
.auth-tab.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(58,123,213,0.4)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.auth-field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-size:14px;color:var(--text);transition:border .2s}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,136,193,0.35)}
.auth-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accentD));color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:10px;margin-top:8px;transition:opacity .2s}
.auth-btn:active{opacity:.9}
.auth-err{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;display:none}

#APP{display:flex;height:100%;padding-top:env(safe-area-inset-top)}
#SIDE{width:320px;min-width:280px;max-width:340px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg1);transition:transform .25s ease}
#MAIN{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

#sHd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border);background:var(--bg1)}
#sHd .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border .2s}
#sHd .av:hover{border-color:var(--accent)}
#sHd .uname{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
#sHd .hbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s;font-size:14px}
#sHd .hbtn:hover{background:var(--bg3);color:var(--text)}

#sSearch{padding:8px 14px;border-bottom:1px solid var(--border)}
#sSearch .wrap{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;transition:border .2s}
#sSearch .wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,136,193,0.35)}
#sSearch i{color:var(--muted);font-size:12px}
#srchIn{flex:1;font-size:13px}
#srchIn::placeholder{color:var(--muted2)}
#srchRes{padding:4px 8px;max-height:180px;overflow-y:auto;background:var(--bg3);border:1px solid var(--border);border-radius:10px;position:absolute;width:calc(100% - 16px);top:100%;right:8px;z-index:100}
.srch-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s}
.srch-item:hover{background:var(--bg2)}
.srch-item .sav{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.srch-item .sname{font-size:13px;font-weight:600;color:var(--text)}
.srch-item .sdesc{font-size:11px;color:var(--muted)}

#sTabs{display:flex;padding:6px 8px;gap:4px;border-bottom:1px solid var(--border);background:var(--bg1)}
.stab{flex:1;padding:7px;border-radius:7px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer;position:relative}
.stab.act{background:var(--surface);color:var(--accent)}
.stab .tbadge{position:absolute;top:3px;right:6px;background:var(--red);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px}

#LIST{flex:1;overflow-y:auto;padding:6px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative}
.li:hover{background:var(--bg2)}
.li.act{background:var(--bg3);border:1px solid var(--border)}
.li .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.li .info{flex:1;min-width:0}
.li .lname{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.li .ltime{font-size:10px;color:var(--muted2);flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.li .ltime .ts{white-space:nowrap}

#PH{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:14px}
#PH .icon{width:64px;height:64px;border-radius:16px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted2)}
#PH p{font-size:16px}

#mHd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0;min-height:56px}
#mHd .back{display:flex;width:28px;height:28px;border-radius:6px;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:background .2s}
#mHd .back:hover{background:var(--bg2)}
#mHd .av2{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
#mHd .info2{flex:1;min-width:0}
#mHd .info2 .n2{font-size:15px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mHd .info2 .s2{font-size:11px;color:var(--muted)}
#mHd .hbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s;font-size:14px}
#mHd .hbtn:hover{background:var(--bg2);color:var(--text)}

#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.bub{max-width:72%;display:flex;flex-direction:column;gap:3px;animation:bubIn .22s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.ot{align-self:flex-start;align-items:flex-start}
.bub .bsender{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.bub .bcont{background:var(--bother);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;line-height:1.5;word-break:break-word;position:relative}
.bub.me .bcont{background:var(--bme);border-radius:16px 16px 4px 16px}
.bub.pending .bcont{opacity:.65}
.bub.failed .bcont{background:var(--redD);border:1px solid var(--red)}
.bub .btime{font-size:10px;color:var(--muted);margin-top:1px}
.bub .brep{background:rgba(0,0,0,0.2);border-left:3px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);margin-bottom:5px;cursor:pointer;transition:background .15s}
.bub .brep:hover{background:rgba(58,123,213,0.15)}
.bub .bimg{max-width:260px;border-radius:10px;cursor:pointer;transition:transform .2s}
.bub .bimg:hover{transform:scale(1.02)}
.bub .breact{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bub .react-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center}
.bub .react-btn:hover{background:rgba(58,123,213,0.2)}
.dayDiv{text-align:center;margin:12px 0}
.dayDiv span{background:var(--bg3);color:var(--muted);font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid var(--border)}

#repStrip{display:none;align-items:center;gap:10px;padding:8px 16px;background:var(--bg3);border-top:1px solid var(--border);font-size:13px}
#repStrip .rtxt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#repStrip .rtxt strong{color:var(--text)}
#repStrip button{color:var(--muted);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:background .15s;background:var(--bg2)}
#repStrip button:hover{background:var(--bg3)}

#inputBar{padding:10px 12px;border-top:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.ibar-inner{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 14px;transition:border .2s}
#msgIn{flex:1;max-height:120px;overflow-y:auto;font-size:14px;line-height:1.5;padding:2px 0;resize:none;background:transparent;border:none;outline:none;color:var(--text)}
#msgIn::placeholder{color:var(--muted2)}
.ibar-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s;font-size:14px;flex-shrink:0}
.ibar-btn:hover{background:var(--bg2);color:var(--text)}
.ibar-send{background:var(--accent);color:#fff;border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .2s}
.ibar-send:hover{background:var(--accentD)}
.ibar-send:active{transform:scale(0.95)}
#fileIn{display:none}

.pane-box{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(8px)}
.pane-box.show{display:flex}
.pane-content{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:90%;max-width:380px;padding:28px 24px;box-shadow:0 12px 48px rgba(0,0,0,0.6)}
.pane-content h3{font-size:18px;font-weight:700;margin-bottom:18px;color:var(--text)}
.pane-field{margin-bottom:16px}
.pane-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pane-field input,.pane-field textarea,.pane-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);transition:border .2s}
.pane-field input:focus,.pane-field textarea:focus,.pane-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,136,193,0.35);outline:none}
.pane-field textarea{resize:vertical;min-height:72px}
.pane-row{display:flex;gap:12px;margin-top:16px}
.pane-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;transition:opacity .2s}
.pane-btn.prim{background:var(--accent);color:#fff}
.pane-btn.sec{background:var(--bg3);color:var(--muted)}

@media(max-width:680px){
  #SIDE{position:fixed;inset:0;width:100%;z-index:200;transform:translateX(0);transition:transform .25s}
  #SIDE.hide{transform:translateX(-100%)}
  #MAIN{position:fixed;inset:0}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="AUTH">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon-wrap"><i class="fas fa-paper-plane"></i></div>
      <h1>Nexa<span>Gram</span></h1>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab act" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
      <div class="auth-tab" id="tabReg" onclick="switchAuthTab('register')">Register</div>
    </div>
    <div id="loginForm">
      <div class="auth-field">
        <label>Username</label>
        <input id="inUser" type="text" placeholder="your_username" autocomplete="username">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="auth-btn" onclick="doAuth()">Sign In</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field">
        <label>Username</label>
        <input id="inUserReg" type="text" placeholder="choose_username" autocomplete="username">
      </div>
      <div class="auth-field">
        <label>Display Name</label>
        <input id="inNameReg" type="text" placeholder="Your Name">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input id="inPassReg" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="auth-btn" onclick="doAuth()">Create Account</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- APP -->
<div id="APP" style="display:none">
  <!-- Sidebar -->
  <div id="SIDE">
    <div id="sHd">
      <div class="av" id="myAv">N</div>
      <div class="uname" id="myName">NexaGram</div>
      <button class="hbtn" onclick="openChanPane()" title="New Channel"><i class="fas fa-plus"></i></button>
      <button class="hbtn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    
    <div id="sSearch">
      <div class="wrap">
        <i class="fas fa-search"></i>
        <input id="srchIn" placeholder="Search users…" oninput="onSearch(this.value)">
      </div>
      <div id="srchRes"></div>
    </div>
    
    <div id="sTabs">
      <div class="stab act" id="tabDM" onclick="switchTab('dm')"><i class="fas fa-comments"></i> Chats</div>
      <div class="stab" id="tabCH" onclick="switchTab('ch')"><i class="fas fa-bullhorn"></i> Channels</div>
    </div>
    
    <div id="LIST"></div>
  </div>

  <!-- Main Content -->
  <div id="MAIN">
    <div id="PH">
      <div class="icon"><i class="fas fa-paper-plane"></i></div>
      <p>Select a chat or channel</p>
    </div>
    
    <div id="CHAT" style="display:none;flex-direction:column;height:100%">
      <div id="mHd">
        <button class="back" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="av2" id="mHdAv">?</div>
        <div class="info2">
          <div class="n2" id="mHdName">—</div>
          <div class="s2" id="mHdSub">—</div>
        </div>
        <button class="hbtn" id="mHdInfo" onclick="openInfo()" title="Info"><i class="fas fa-info-circle"></i></button>
        <button class="hbtn" onclick="loadMessages()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
      </div>
      
      <div id="msgs"></div>
      
      <div id="repStrip">
        <i class="fas fa-reply" style="color:var(--accent)"></i>
        <div class="rtxt" id="repTxt">Replying to <strong id="repName"></strong></div>
        <button onclick="clearReply()"><i class="fas fa-times"></i></button>
      </div>
      
      <div id="inputBar">
        <div class="ibar-inner">
          <textarea id="msgIn" placeholder="Message…" rows="1" oninput="autoGrow(this);onDraftChange()" onkeydown="onMsgKey(event)"></textarea>
          <input type="file" id="fileIn" accept="image/*,video/*" onchange="onFileInput(this)">
          <button class="ibar-btn" onclick="document.getElementById('fileIn').click()" title="Attach"><i class="fas fa-paperclip"></i></button>
          <button class="ibar-send" onclick="sendMsg()" title="Send"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="TOAST"></div>

<script>
(function(){
'use strict';

// ==========================================
// MOCK BACKEND - Simulates API for demo
// ==========================================
const STORAGE = localStorage;

// Mock users database
const MOCK_USERS = {
  'demo_user': { password: 'demo_pass', display_name: 'Demo User', token: 'demo-token-123' },
  'test_user': { password: 'test123', display_name: 'Test User', token: 'test-token-456' }
};

// Mock chats data
const MOCK_CHATS = {
  'chat_1': { id: 'chat_1', type: 'dm', name: 'Demo User', last_message: 'Hey there!', last_at: new Date().toISOString(), peer: { username: 'demo_user', display_name: 'Demo User' }, is_group: false, member_count: 2 },
  'chat_2': { id: 'chat_2', type: 'dm', name: 'Test User', last_message: 'Hello!', last_at: new Date(Date.now() - 3600000).toISOString(), peer: { username: 'test_user', display_name: 'Test User' }, is_group: false, member_count: 2 }
};

// ==========================================
// CONFIGURATION
// ==========================================
const BACKEND = {
  // Mock API - simulate network delay
  delay: (ms = 500) => new Promise(resolve => setTimeout(resolve, ms)),
  
  apiCall: async function(action, body = {}, noAuth = false) {
    await this.delay(800); // Simulate network latency
    
    // Auth check
    const user = STORAGE.getItem('nexagram_user');
    const isLoggedIn = user ? JSON.parse(user).token : null;
    
    // Mock login
    if (action === 'login') {
      const { username, password } = body;
      if (MOCK_USERS[username] && MOCK_USERS[username].password === password) {
        const userData = {
          token: MOCK_USERS[username].token,
          username: username,
          display_name: MOCK_USERS[username].display_name
        };
        STORAGE.setItem('nexagram_user', JSON.stringify(userData));
        return { success: true, token: userData.token, user: userData };
      }
      return { success: false, error: 'Invalid username or password' };
    }
    
    // Mock register
    if (action === 'register') {
      const { username, password, display_name } = body;
      if (MOCK_USERS[username]) {
        return { success: false, error: 'Username already exists' };
      }
      MOCK_USERS[username] = { password, display_name, token: 'mock-token-' + Date.now() };
      STORAGE.setItem('nexagram_user', JSON.stringify({ token: MOCK_USERS[username].token, username, display_name }));
      return { success: true, token: MOCK_USERS[username].token, user: { username, display_name } };
    }
    
    // Mock list_chats
    if (action === 'list_chats') {
      return { 
        success: true, 
        chats: Object.values(MOCK_CHATS).map(c => ({
          ...c,
          id: c.id,
          last_message: c.last_message || 'No messages yet',
          last_at: c.last_at || new Date().toISOString()
        }))
      };
    }
    
    // Mock get_messages
    if (action === 'get_messages' || action === 'get_channel_messages') {
      const chatId = body.chat_id || body.channel_id;
      const chat = MOCK_CHATS[chatId];
      if (!chat) return { success: false, error: 'Chat not found' };
      
      const messages = [
        { id: 'msg_1', sender_id: 'current_user', sender_name: 'You', content: 'Hello!', created_at: new Date().toISOString(), type: 'text' },
        { id: 'msg_2', sender_id: chat.peer?.username || 'other', sender_name: chat.name, content: 'Hi there!', created_at: new Date(Date.now() - 10000).toISOString(), type: 'text' }
      ];
      return { success: true, messages };
    }
    
    // Mock send_message
    if (action === 'send_message' || action === 'send_channel_message') {
      await this.delay(500);
      return { success: true };
    }
    
    // Mock react_message
    if (action === 'react_message') {
      return { success: true };
    }
    
    // Mock reply
    if (action === 'reply_message') {
      return { success: true };
    }
    
    return { success: false, error: 'Unknown action' };
  }
};

// ==========================================
// HELPERS
// ==========================================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function apiCall(action, body = {}, noAuth = false) {
  return BACKEND.apiCall(action, body, noAuth);
}

function loadSession() {
  const u = STORAGE.getItem('nexagram_user');
  if (u) try { return JSON.parse(u); } catch {}
  return null;
}

function saveSession(u) { STORAGE.setItem('nexagram_user', JSON.stringify(u)); }
function clearSession() { STORAGE.removeItem('nexagram_user'); }

function showToast(msg, type = 'info') {
  const tc = $('#TOAST');
  if (!tc) return;
  
  const toast = document.createElement('div');
  const bgColor = type === 'error' ? 'rgba(235,83,83,0.9)' : 'rgba(19,32,50,0.95)';
  const borderColor = type === 'error' ? 'var(--red)' : 'var(--accent)';
  
  toast.className = `toast ${type}`;
  toast.style.cssText = `
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:${bgColor};
    border:1px solid ${borderColor};
    border-radius:10px;
    font-size:14px;
    max-width:320px;
    box-shadow:0 4px 20px rgba(0,0,0,0.6);
    animation:toastIn .3s ease forwards;
    border-left:3px solid ${borderColor};
  `;
  toast.textContent = msg;
  tc.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => {
      try { toast.remove(); } catch {} 
    }, 300);
  }, 3000);
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function avatarColor(name=''){
  const colors = ['#3a7bd5', '#a97fff', '#74b9ff', '#5ac8fa', '#2b934f', '#e879f9', '#fd79a8', '#ff6b6b', '#ffd93d', '#118ab2'];
  let h = 0;
  for (const c of name) h = (h*31 + c.charCodeAt(0)) & 0xFFFF;
  return colors[h % colors.length];
}

function initials(name=''){
  return name.split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
}

// ==========================================
// AUTH
// ==========================================
let isRegister = false;

function switchAuthTab(mode) {
  isRegister = mode === 'register';
  $('#tabLogin').classList.toggle('act', !isRegister);
  $('#tabReg').classList.toggle('act', isRegister);
  $('#loginForm').style.display = isRegister ? 'none' : 'block';
  $('#registerForm').style.display = isRegister ? 'block' : 'none';
  $('#authErr').style.display = 'none';
}

async function doAuth() {
  const usernameEl = isRegister ? $('#inUserReg') : $('#inUser');
  const passwordEl = isRegister ? $('#inPassReg') : $('#inPass');
  const displayNameEl = isRegister ? $('#inNameReg') : null;
  
  const errEl = $('#authErr');
  errEl.style.display = 'none';
  
  const username = usernameEl ? usernameEl.value.trim() : '';
  const password = passwordEl ? passwordEl.value : '';
  
  if (!username || !password) {
    errEl.textContent = 'Username and password required';
    errEl.style.display = 'block';
    return;
  }
  
  if (isRegister && !displayNameEl?.value?.trim()) {
    errEl.textContent = 'Display name required';
    errEl.style.display = 'block';
    return;
  }
  
  const btn = $('.auth-btn');
  const originalText = btn.textContent;
  btn.textContent = 'Please wait...';
  btn.disabled = true;
  
  try {
    const body = isRegister 
      ? { username: username, password: password, display_name: displayNameEl.value.trim() }
      : { username: username, password: password };
    
    const data = await apiCall(isRegister ? 'register' : 'login', body, true);
    
    if (data.success && data.token) {
      currentUser = { token: data.token, ...(data.user || {}) };
      saveSession(currentUser);
      showApp();
      initApp();
      showToast(isRegister ? 'Account created successfully!' : 'Logged in successfully!');
    } else {
      errEl.textContent = data.error || (isRegister ? 'Registration failed' : 'Authentication failed');
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    showToast('Something went wrong', 'error');
  } finally {
    btn.textContent = isRegister ? 'Create Account' : 'Sign In';
    btn.disabled = false;
  }
}

// ==========================================
// APP INIT
// ==========================================
function showAuth() { $('#AUTH').style.display = 'flex'; $('#APP').style.display = 'none'; }
function showApp() { $('#AUTH').style.display = 'none'; $('#APP').style.display = 'flex'; }

function initApp() {
  const saved = loadSession();
  if (saved?.token) {
    currentUser = saved;
    renderChatList();
  }
}

// ==========================================
// CHAT LIST
// ==========================================
async function loadChats() {
  try {
    const data = await apiCall('list_chats');
    if (data.success && data.chats) {
      data.chats.forEach(c => {
        chats[c.id] = c;
        if (!c.is_group && c.peer) {
          c.name = c.peer.display_name || c.peer.username || 'Unknown';
        }
        if (c.is_group) c.name = c.name || 'Group Chat';
      });
      renderChatList();
    }
  } catch(e) {
    console.warn('loadChats', e);
  }
}

function renderChatList() {
  const container = $('#LIST');
  if (!container) return;
  
  let html = '';
  
  Object.values(chats).forEach(chat => {
    const isActive = currentChatId == chat.id;
    const avColor = avatarColor(chat.name);
    
    html += `
    <div class="li${isActive ? ' act' : ''}" data-id="${chat.id}" onclick="openChat(${chat.id})">
      <div class="av" style="background:linear-gradient(135deg,${avColor},#1a56a0)">${initials(chat.name)}</div>
      <div class="info">
        <div class="lname">${escHtml(chat.name)}</div>
        <div class="lsub">${escHtml(chat.last_message || 'No messages yet')}</div>
        <div class="ltime"><span class="ts">${fmtTime(chat.last_at || chat.created_at)}</span></div>
      </div>
    </div>`;
  });
  
  if (!Object.keys(chats).length) {
    html = '<div class="li">No chats yet. Start by logging in!</div>';
  }
  
  container.innerHTML = html;
}

// ==========================================
// SEARCH
// ==========================================
function onSearch(query) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    if (!query.trim()) {
      renderChatList();
      return;
    }
    const filtered = Object.values(chats).filter(c => 
      (c.name || '').toLowerCase().includes(query.toLowerCase())
    );
    const container = $('#LIST');
    let html = '';
    filtered.forEach(chat => {
      html += `<div class="li act" data-id="${chat.id}" onclick="openChat(${chat.id})">
        <div class="av" style="background:linear-gradient(135deg,${avatarColor(chat.name)},#1a56a0)">${initials(chat.name)}</div>
        <div class="info"><div class="lname">${escHtml(chat.name)}</div></div>
      </div>`;
    });
    container.innerHTML = html || `<div class="li">No results found</div>`;
  }, 300);
}

function escHtml(s=''){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==========================================
// OPEN CHAT
// ==========================================
async function openChat(chatId) {
  const chat = chats[chatId];
  if (!chat) return;
  
  currentChatId = chatId;
  currentChat = chat;
  
  // Update active state
  $$('.li').forEach(li => li.classList.toggle('act', li.dataset.id == chatId));
  
  // Show chat view
  $('#PH').classList.add('hidden');
  $('#CHAT').style.display = 'flex';
  
  // Update header
  const avEl = $('#mHdAv');
  if (avEl) {
    avEl.style.background = `linear-gradient(135deg,${avatarColor(chat.name)},#1a56a0)`;
    avEl.textContent = initials(chat.name);
  }
  $('#mHdName').textContent = chat.name || 'Chat';
  $('#mHdSub').textContent = chat.is_group ? `${chat.member_count || 2} members` : 'online';
  
  // Load messages
  $('#msgs').innerHTML = '<div style="text-align:center;color:var(--muted);padding:32px">Loading messages...</div>';
  await loadMessages();
}

function goBack() {
  currentChat = null;
  currentChatId = null;
  $('#CHAT').style.display = 'none';
  $('#PH').classList.remove('hidden');
}

// ==========================================
// MESSAGES
// ==========================================
async function loadMessages() {
  if (!currentChat || !currentChat.id) return;
  
  const action = currentChat.type === 'channel' ? 'get_channel_messages' : 'get_messages';
  const key = currentChat.type === 'channel' ? 'channel_id' : 'chat_id';
  
  try {
    const data = await apiCall(action, { [key]: currentChat.id, limit: 50 });
    
    if (data.success && data.messages) {
      renderMessages(data.messages);
    } else {
      $('#msgs').innerHTML = `<div style="text-align:center;color:var(--muted);padding:20px">${data.error || 'No messages'}</div>`;
    }
  } catch(e) {
    console.warn('loadMessages', e);
    $('#msgs').innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">Error loading messages</div>';
  }
}

function renderMessages(msgs) {
  const container = $('#msgs');
  if (!container) return;
  
  let html = '';
  let lastDate = '';
  
  msgs.forEach(msg => {
    const msgDate = new Date(msg.created_at).toDateString();
    if (msgDate !== lastDate) {
      const date = new Date(msg.created_at);
      html += `<div class="dayDiv"><span>${date.toLocaleDateString([], {month: 'short', day: 'numeric', year: 'numeric'})}</span></div>`;
      lastDate = msgDate;
    }
    
    const mine = msg.sender_id === currentUser?.id;
    html += renderMessage(msg, mine);
  });
  
  container.innerHTML = html;
  if (container.scrollHeight > container.clientHeight) {
    container.scrollTop = container.scrollHeight;
  }
}

function renderMessage(msg, mine) {
  const time = fmtTime(msg.created_at);
  const senderName = msg.sender_name || 'You';
  const content = msg.content || '';
  const mediaUrl = msg.media_url || '';
  const mediaName = msg.media_name || '';
  
  let contentHtml = '';
  if (msg.type === 'image' && mediaUrl) {
    contentHtml = `<img src="${mediaUrl}" class="bimg" onclick="openLightbox('${mediaUrl}')">`;
  } else if (msg.type === 'video' && mediaUrl) {
    contentHtml = `<video src="${mediaUrl}" class="bimg" controls preload="no"></video>`;
  } else if (msg.type === 'file' && mediaUrl) {
    const ext = (mediaName.split('.').pop() || 'FILE').toUpperCase();
    contentHtml = `<div class="bfile"><i class="fas fa-file"></i><a href="${mediaUrl}" target="_blank">${ext} • ${escHtml(mediaName)}</a></div>`;
  } else {
    contentHtml = content ? `<div class="btxt">${escHtml(content)}</div>` : '';
  }
  
  let replyHtml = '';
  if (msg.reply_to && msg.reply_to.id) {
    replyHtml = `<div class="brep" onclick="setReply(${msg.reply_to.id}, \`${escHtml(msg.reply_to.content || '[Media]')}\`)">
      <strong>${escHtml(msg.reply_to.sender_name || 'Unknown')}</strong>: ${escHtml(msg.reply_to.content || '[Media]')}
    </div>`;
  }
  
  const reactionsHtml = msg.reactions && msg.reactions.length 
    ? '<div class="breact">' + msg.reactions.map(r => `<span class="react-btn" onclick="reactMsg(${msg.id}, \`${r.emoji}\`)">${r.emoji}</span>`).join('') + '</div>'
    : '';
  
  return `
  <div class="bub ${mine ? 'me' : 'ot'}">
    ${!mine && msg.sender_name ? `<div class="bsender">${escHtml(senderName)}</div>` : ''}
    ${replyHtml}
    ${contentHtml}
    <div class="bubble-meta">
      <div class="btime">${time}</div>
    </div>
    ${reactionsHtml}
  </div>`;
}

// ==========================================
// SEND MESSAGE
// ==========================================
async function sendMsg() {
  const input = $('#msgIn');
  if (!input) return;
  const text = input.value.trim();
  
  if (!text || !currentChat) {
    showToast('Nothing to send', 'error');
    return;
  }
  
  const action = currentChat.type === 'channel' ? 'send_channel_message' : 'send_message';
  const key = currentChat.type === 'channel' ? 'channel_id' : 'chat_id';
  
  const payload = {
    type: 'text',
    content: text,
    [key]: currentChat.id,
    reply_to_id: replyData ? replyData.id : null
  };
  
  input.value = '';
  autoGrow(input);
  clearReply();
  
  try {
    const data = await apiCall(action, payload);
    if (data.success) {
      await loadMessages();
      showToast('Message sent!');
    } else {
      showToast('Failed to send message', 'error');
      input.value = text;
    }
  } catch(e) {
    showToast('Error sending message', 'error');
    input.value = text;
  }
}

function autoGrow(input) {
  if (!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

function onDraftChange() {
  if (currentChatId) {
    STORAGE.setItem(`draft_${currentChatId}`, $('#msgIn').value);
  }
}

function onMsgKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

// ==========================================
// FILE UPLOAD (MOCK)
// ==========================================
async function onFileInput(input) {
  const file = input?.files?.[0];
  if (!file || !currentChat) {
    if (input) input.value = '';
    return;
  }
  
  // Mock upload - simulate successful upload
  await apiCall('send_message', {
    type: file.type.startsWith('image/') ? 'image' : 'file',
    media_url: URL.createObjectURL(file),
    media_name: file.name,
    [currentChat.type === 'channel' ? 'channel_id' : 'chat_id']: currentChat.id
  });
  
  await loadMessages();
  showToast('File uploaded!');
  
  if (input) input.value = '';
}

// ==========================================
// REPLY
// ==========================================
function clearReply() {
  replyData = null;
  const repStrip = $('#repStrip');
  if (repStrip) repStrip.style.display = 'none';
}

function setReply(id, text) {
  replyData = { id, text: text || '' };
  const repTxt = $('#repTxt');
  const repName = $('#repName');
  if (repTxt) repTxt.textContent = `Replying to: ${text || 'Unknown'}`;
  if (repName) repName.textContent = 'Unknown';
  const repStrip = $('#repStrip');
  if (repStrip) repStrip.style.display = 'flex';
}

// ==========================================
// REACTIONS
// ==========================================
async function reactMsg(msgId, emoji) {
  try {
    await apiCall('react_message', { message_id: msgId, emoji });
    if (currentChat) await loadMessages();
  } catch(e) {
    console.warn('reactMsg', e);
  }
}

// ==========================================
// LIGHTBOX
// ==========================================
function openLightbox(src) {
  // Simple lightbox - open in new tab
  window.open(src, '_blank');
}

// ==========================================
// CHANNELS PANE
// ==========================================
function openChanPane() {
  showToast('Feature coming soon!', 'info');
}

// ==========================================
// INFO
// ==========================================
function openInfo() {
  if (!currentChat) return;
  showToast(`Info: ${currentChat.name || ''}`, 'info');
}

// ==========================================
// LOGOUT
// ==========================================
function logout() {
  currentUser = null;
  clearSession();
  currentChat = null;
  chats = {};
  messages = {};
  currentChatId = null;
  showAuth();
  showToast('Logged out', 'info');
}

// ==========================================
// INIT
// ==========================================
let currentUser = null;
let currentChatId = null;
let currentChat = null;
let chats = {};
let searchDebounce = null;

document.addEventListener('DOMContentLoaded', () => {
  const saved = loadSession();
  if (saved?.token) {
    currentUser = saved;
    showApp();
    initApp();
  } else {
    showAuth();
  }
});

})();
</script>
