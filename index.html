<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>NexaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0e14}
body{font-family:'Inter',-apple-system,sans-serif;color:#e2eaf4;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0a0e14;--bg1:#0f1520;--bg2:#151d2b;--bg3:#1c2538;--bg4:#233048;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --text:#e2eaf4;--muted:#6b82a0;--muted2:#8da0bc;
  --accent:#5b8af5;--accent2:#4a7ae8;--accentD:rgba(91,138,245,.15);
  --green:#22c55e;--greenD:rgba(34,197,94,.15);
  --red:#ef4444;--redD:rgba(239,68,68,.12);
  --bubble-me:#1d3a6e;--bubble-other:#151d2b;
  --mono:'JetBrains Mono',monospace;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ══════ AUTH ══════ */
#AUTH{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(ellipse 140% 100% at 50% 0%,#0d1a2e,var(--bg) 60%)}
.auth-wrap{width:100%;max-width:360px}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo-icon{width:72px;height:72px;margin:0 auto .75rem;background:linear-gradient(135deg,var(--accent),#7c3aed);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 16px 40px rgba(91,138,245,.35)}
.auth-logo h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.auth-logo p{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.auth-card{background:var(--bg1);border:1px solid var(--border2);border-radius:20px;padding:1.8rem 1.5rem;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.auth-label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.4rem;display:block}
.auth-input{width:100%;padding:.72rem 1rem;background:var(--bg2);border:1.5px solid var(--border2);border-radius:10px;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:.9rem}
.auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentD)}
.auth-btn{width:100%;padding:.82rem;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:.92rem;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;margin-top:.3rem;letter-spacing:.01em}
.auth-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.auth-btn:active{transform:none}
.auth-switch{text-align:center;margin-top:1.1rem;font-size:.8rem;color:var(--muted)}
.auth-switch span{color:var(--accent);cursor:pointer;font-weight:600}
.auth-err{color:var(--red);font-size:.75rem;text-align:center;margin-top:.5rem;min-height:1em}

/* ══════ APP ══════ */
#APP{display:none;height:100vh;flex-direction:column}
#APP.show{display:flex}

/* ══════ MAIN LAYOUT ══════ */
.app-body{flex:1;display:flex;overflow:hidden;min-height:0}

/* ══════ SIDEBAR ══════ */
#SB{width:320px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.sb-top{padding:.9rem 1rem;display:flex;align-items:center;gap:.6rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-top-logo{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.sb-top-logo span{color:var(--text)}
.sb-actions{margin-left:auto;display:flex;gap:.35rem}
.sb-icon-btn{width:34px;height:34px;border-radius:9px;background:none;border:none;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .15s}
.sb-icon-btn:hover{background:var(--bg3);color:var(--text)}

.sb-search-bar{padding:.6rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-search-input{width:100%;padding:.55rem .9rem .55rem 2.2rem;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--text);outline:none;position:relative}
.sb-search-input::placeholder{color:var(--muted)}
.sb-search-wrap{position:relative}
.sb-search-wrap i{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.75rem;pointer-events:none}

.sb-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-tab{flex:1;padding:.65rem;font-size:.72rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.3rem}
.sb-tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.sb-list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sb-new-bar{padding:.55rem .9rem;border-bottom:1px solid var(--border);display:flex;gap:.4rem;flex-shrink:0}
.sb-new-btn{flex:1;padding:.48rem .5rem;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--muted2);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.3rem;transition:all .15s}
.sb-new-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accentD)}

.sb-item{display:flex;align-items:center;gap:.75rem;padding:.72rem 1rem;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;position:relative}
.sb-item:hover,.sb-item.active{background:var(--bg2)}
.sb-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:#fff;overflow:hidden;background:var(--bg3)}
.av img{width:100%;height:100%;object-fit:cover}
.av.channel{border-radius:13px}
.av.group{border-radius:50%}
.av-text{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.sb-item-info{flex:1;min-width:0}
.sb-item-row1{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;margin-bottom:.2rem}
.sb-item-name{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item-time{font-size:.65rem;color:var(--muted);flex-shrink:0}
.sb-item-last{font-size:.77rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.8rem}
.sb-empty i{font-size:2rem;opacity:.3;display:block;margin-bottom:.7rem}

/* ══════ CHAT AREA ══════ */
#CA{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;position:relative}
.ca-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}
.ca-placeholder i{font-size:3rem;opacity:.15;margin-bottom:.8rem}
.ca-placeholder p{font-size:.85rem}

/* Chat Header */
.ca-head{padding:.8rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;background:var(--bg1);flex-shrink:0;min-height:60px}
.ca-back{display:none;width:32px;height:32px;border-radius:9px;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:1rem;align-items:center;justify-content:center}
.ca-head-name{font-size:.93rem;font-weight:700}
.ca-head-sub{font-size:.68rem;color:var(--muted);margin-top:.06rem}
.ca-head-right{margin-left:auto;display:flex;gap:.3rem}

/* Messages */
.ca-msgs{flex:1;overflow-y:auto;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.25rem;overscroll-behavior:contain}
.msg-date-sep{text-align:center;margin:.6rem 0;font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.msg-date-sep span{background:var(--bg2);padding:.18rem .55rem;border-radius:10px}

.msg-group{display:flex;flex-direction:column;gap:.1rem}
.msg-row{display:flex;gap:.5rem;max-width:78%;padding:0 .15rem}
.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;align-self:flex-end;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av.hidden{opacity:0;pointer-events:none}
.msg-content{display:flex;flex-direction:column;gap:.08rem;min-width:0}
.msg-sender-name{font-size:.68rem;font-weight:600;color:var(--accent);padding-left:.1rem;margin-bottom:.05rem}

.bubble{background:var(--bubble-other);border-radius:16px 16px 16px 4px;padding:.55rem .78rem;position:relative;cursor:pointer;transition:background .12s;word-break:break-word;max-width:100%}
.msg-row.mine .bubble{background:var(--bubble-me);border-radius:16px 16px 4px 16px}
.bubble:hover{filter:brightness(1.1)}
.bubble-text{font-size:.88rem;line-height:1.5;white-space:pre-wrap}
.bubble-time{font-size:.6rem;color:rgba(255,255,255,.4);text-align:right;margin-top:.25rem;display:flex;align-items:center;justify-content:flex-end;gap:.25rem}
.bubble-time .read-tick{color:var(--accent)}

/* Reply preview inside bubble */
.reply-preview{background:rgba(255,255,255,.06);border-left:2px solid var(--accent);border-radius:4px;padding:.25rem .5rem;margin-bottom:.4rem;font-size:.73rem;cursor:pointer}
.reply-preview .rp-name{color:var(--accent);font-weight:600;margin-bottom:.05rem}
.reply-preview .rp-text{color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Media in bubble */
.bubble-media{margin-bottom:.3rem;border-radius:10px;overflow:hidden;max-width:260px}
.bubble-media img,.bubble-media video{display:block;width:100%;max-height:280px;object-fit:cover}
.bubble-media audio{width:100%;padding:.4rem 0}
.file-attach{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.06);border-radius:8px;padding:.4rem .6rem;font-size:.78rem}
.file-attach i{color:var(--accent)}

/* Reactions on bubble */
.bubble-reactions{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
.reaction-pill{display:flex;align-items:center;gap:.2rem;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:.18rem .45rem;font-size:.75rem;cursor:pointer;transition:all .12s;user-select:none}
.reaction-pill:hover,.reaction-pill.mine{background:var(--accentD);border-color:var(--accent)}
.reaction-pill .rcount{font-size:.65rem;color:var(--muted2);font-weight:600}

/* Reply swipe indicator */
.msg-row.replying .bubble{background:var(--accentD)!important}

/* Input area */
.ca-input-area{border-top:1px solid var(--border);background:var(--bg1);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.reply-bar{display:none;align-items:center;gap:.5rem;padding:.5rem 1rem .0rem;border-bottom:1px dashed var(--border)}
.reply-bar.vis{display:flex}
.reply-bar-content{flex:1;min-width:0}
.reply-bar-name{font-size:.68rem;color:var(--accent);font-weight:600}
.reply-bar-text{font-size:.73rem;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar-close{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:none;color:var(--muted2);cursor:pointer;flex-shrink:0;font-size:.7rem}

.ca-input-row{display:flex;align-items:flex-end;gap:.5rem;padding:.6rem .9rem .7rem}
.ca-attach-btn{width:38px;height:38px;border-radius:50%;background:none;border:none;color:var(--muted2);cursor:pointer;flex-shrink:0;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:color .15s}
.ca-attach-btn:hover{color:var(--accent)}
.ca-textarea-wrap{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:22px;display:flex;align-items:flex-end;padding:.1rem .5rem}
.ca-textarea{flex:1;background:none;border:none;resize:none;font-family:'Inter',sans-serif;font-size:.88rem;color:var(--text);outline:none;padding:.52rem .4rem;max-height:120px;line-height:1.45;overflow-y:auto}
.ca-textarea::placeholder{color:var(--muted)}
.ca-emoji-btn{width:32px;height:32px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;flex-shrink:0;align-self:flex-end;padding-bottom:.45rem}
.ca-send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;color:#fff;cursor:pointer;flex-shrink:0;font-size:.9rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(91,138,245,.4);transition:all .15s}
.ca-send-btn:hover{filter:brightness(1.1)}

/* Upload progress */
.upload-bar{padding:.4rem 1rem;background:var(--accentD);border-top:1px solid var(--border);display:none;align-items:center;gap:.6rem;font-size:.75rem}
.upload-bar.vis{display:flex}
.upload-bar-track{flex:1;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.upload-bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .2s}

/* ══════ EMOJI PICKER ══════ */
.emoji-picker{position:absolute;bottom:70px;right:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:.6rem;display:flex;gap:.35rem;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:100;opacity:0;visibility:hidden;transform:translateY(8px);transition:all .15s}
.emoji-picker.vis{opacity:1;visibility:visible;transform:none}
.ep-emoji{font-size:1.35rem;cursor:pointer;padding:.25rem;border-radius:8px;transition:background .1s;user-select:none}
.ep-emoji:hover{background:var(--bg3)}

/* Context menu for message (react / reply / delete) */
.ctx-menu{position:fixed;z-index:500;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:.4rem;box-shadow:0 12px 40px rgba(0,0,0,.6);min-width:170px;opacity:0;visibility:hidden;transition:opacity .12s,visibility .12s}
.ctx-menu.vis{opacity:1;visibility:visible}
.ctx-item{display:flex;align-items:center;gap:.55rem;padding:.52rem .75rem;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:500;transition:background .1s}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger:hover{background:var(--redD)}
.ctx-reactions{display:flex;gap:.3rem;padding:.4rem .5rem;border-bottom:1px solid var(--border)}
.ctx-react{font-size:1.3rem;cursor:pointer;padding:.2rem .25rem;border-radius:8px;transition:background .1s}
.ctx-react:hover{background:var(--bg3)}

/* ══════ MODALS ══════ */
.modal-bg{position:fixed;inset:0;z-index:800;background:rgba(5,8,14,.85);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.modal-bg.on{opacity:1;visibility:visible}
@media(min-width:600px){.modal-bg{align-items:center;padding:1rem}}
.modal{width:100%;max-width:480px;background:var(--bg1);border-radius:22px 22px 0 0;padding:1.4rem 1.3rem 1.6rem;transform:translateY(30px);transition:transform .22s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:20px;transform:scale(.94)}}
.modal-bg.on .modal{transform:translateY(0)}
@media(min-width:600px){.modal-bg.on .modal{transform:scale(1)}}
.modal-handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto .9rem}
@media(min-width:600px){.modal-handle{display:none}}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.modal-input{width:100%;padding:.65rem .9rem;background:var(--bg2);border:1.5px solid var(--border2);border-radius:10px;font-family:'Inter',sans-serif;font-size:.85rem;color:var(--text);outline:none;margin-bottom:.65rem;transition:border-color .18s}
.modal-input:focus{border-color:var(--accent)}
.modal-btn{width:100%;padding:.72rem;border-radius:12px;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all .15s;margin-bottom:.45rem}
.modal-btn.primary{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff}
.modal-btn.secondary{background:var(--bg3);color:var(--muted2)}
.modal-btn.danger{background:var(--redD);color:var(--red)}
.modal-label{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem;display:block}
.search-results-list{max-height:240px;overflow-y:auto;border-radius:10px;background:var(--bg2)}
.sr-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;cursor:pointer;transition:background .1s}
.sr-item:hover{background:var(--bg3)}
.sr-item-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.sr-item-name{font-size:.82rem;font-weight:600}
.sr-item-user{font-size:.7rem;color:var(--muted)}

/* Profile modal */
.profile-av-wrap{text-align:center;margin-bottom:1.1rem}
.profile-av-big{width:80px;height:80px;border-radius:50%;margin:0 auto .6rem;font-size:1.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer}
.profile-av-big::after{content:'\f030';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:1.3rem;opacity:0;transition:opacity .2s}
.profile-av-big:hover::after{opacity:1}
.profile-av-big img{width:100%;height:100%;object-fit:cover}

/* Channel members list */
.member-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .1rem;border-bottom:1px solid var(--border)}
.member-item:last-child{border-bottom:none}
.member-role{margin-left:auto;font-size:.62rem;font-weight:700;padding:.15rem .4rem;border-radius:6px}
.member-role.owner{background:rgba(255,193,7,.15);color:#ffc107}
.member-role.admin{background:var(--accentD);color:var(--accent)}
.member-role.member{background:var(--bg3);color:var(--muted)}

/* ══════ BOTTOM NAV (mobile) ══════ */
#BOTNAV{display:none;height:58px;background:var(--bg1);border-top:1px solid var(--border);flex-shrink:0;padding:0 .5rem;padding-bottom:var(--safe-bottom)}
#BOTNAV.show{display:flex;align-items:center;justify-content:space-around}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.5rem;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);transition:color .15s;border-radius:10px}
.bn-item.on,.bn-item:hover{color:var(--accent)}
.bn-item i{font-size:1.1rem}

/* ══════ TOASTS ══════ */
#TOASTS{position:fixed;top:1rem;right:1rem;left:1rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem;pointer-events:none;align-items:flex-end}
.toast{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:.6rem .9rem;font-size:.78rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:300px;pointer-events:all;transform:translateX(120%);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.toast.show{transform:translateX(0)}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--accent)}

/* ══════ RESPONSIVE ══════ */
@media(max-width:720px){
  #SB{width:100%;position:absolute;inset:0;z-index:200;transform:translateX(0)}
  #SB.hidden{transform:translateX(-100%)}
  #CA{position:absolute;inset:0;z-index:100;transform:translateX(100%)}
  #CA.active{transform:translateX(0)}
  .ca-back{display:flex}
  #BOTNAV{display:none!important}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="AUTH">
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-icon">💬</div>
      <h1>NexaGram</h1>
      <p>Your private messaging world</p>
    </div>
    <div class="auth-card">
      <div id="authRegisterField" style="display:none">
        <label class="auth-label">Display Name</label>
        <input class="auth-input" type="text" id="inDisplayName" placeholder="Tumhara naam">
      </div>
      <label class="auth-label">Username</label>

<div id="TOASTS"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
// CONFIG — change this to your Marya Vault backend URL
// ═══════════════════════════════════════════════════════
var BACKEND = 'https://marya-hosting.pages.dev';
var CHAT_API = BACKEND + '/btfstorage/chat';
var UPLOAD_API = BACKEND + '/upload';

// ══ STATE ══
var TOKEN = localStorage.getItem('ng_token') || '';
var ME = null;
var curTab = 'chats';
var curChat = null; // {type, id, name, role, peer, is_group, post_mode}
var chatsCache = [], channelsCache = [];
var pollTimer = null;
var replyingTo = null; // {id, sender_name, content}
var ctxMsg = null; // currently context-menu-ed message
var isMobile = window.innerWidth <= 720;

function g(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ return (n||'?').trim().slice(0,2).toUpperCase(); }
function timeShort(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  var diff = now - d;
  if(diff < 7*86400000) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return d.toLocaleDateString([],{day:'2-digit',month:'short'});
}
function timeFull(ts){ return ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''; }

function toast(msg, type){
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'info');
  el.textContent = msg;
  g('TOASTS').appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 280); }, 3200);
}

// ══ API ══
async function api(action, body, noAuth){
  var headers = {'Content-Type':'application/json'};
  if(!noAuth) headers['X-Session-Token'] = TOKEN;
  try{
    var r = await fetch(CHAT_API, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(Object.assign({action:action}, body||{}))
    });
    var d = await r.json();
    if(r.status === 401){ logout(); return null; }
    return d;
  } catch(e){ toast('Network error: '+e.message,'error'); return null; }
}

// ══ AUTH ══
window.addEventListener('DOMContentLoaded', function(){
  g('inPassword').addEventListener('keydown', function(e){ if(e.key==='Enter') submitAuth(); });
  g('authBtn').addEventListener('click', submitAuth);
  g('msgIn').addEventListener('input', autoResizeTextarea);
  g('msgIn').addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  window.addEventListener('resize', function(){ isMobile = window.innerWidth <= 720; });
  document.addEventListener('click', function(e){
    if(!g('ctxMenu').contains(e.target)) hideCtxMenu();
    if(!g('emojiPicker').contains(e.target) && !e.target.classList.contains('ca-emoji-btn'))
      g('emojiPicker').classList.remove('vis');
  });
  if(TOKEN){
    api('me').then(function(r){
      if(r && r.success){ ME = r.user; enterApp(); }
      else { TOKEN = ''; localStorage.removeItem('ng_token'); }
    });
  }
});

var isRegister = false;
window.toggleAuth = function(){
  isRegister = !isRegister;
  g('authRegisterField').style.display = isRegister ? 'block' : 'none';
  g('authBtn').textContent = isRegister ? 'Create Account' : 'Continue';
  g('authSwitch').innerHTML = isRegister
    ? 'Already have an account? <span onclick="toggleAuth()">Login</span>'
    : 'Don\'t have an account? <span onclick="toggleAuth()">Register</span>';
};

async function submitAuth(){
  var un = g('inUsername').value.trim();
  var pw = g('inPassword').value;
  if(!un || !pw){ g('authErr').textContent = 'Fill all fields'; return; }
  g('authErr').textContent = '';
  var r;
  if(isRegister){
    var dn = g('inDisplayName').value.trim() || un;
    r = await api('register', {username:un, password:pw, display_name:dn}, true);
  } else {
    r = await api('login', {username:un, password:pw}, true);
  }
  if(!r || !r.success){ g('authErr').textContent = r ? r.error : 'Connection failed'; return; }
  TOKEN = r.token; ME = r.user;
  localStorage.setItem('ng_token', TOKEN);
  enterApp();
}

function logout(){
  TOKEN = ''; ME = null;
  localStorage.removeItem('ng_token');
  clearInterval(pollTimer);
  curChat = null;
  g('APP').classList.remove('show');
  g('AUTH').style.display = 'flex';
  g('inUsername').value = ''; g('inPassword').value = '';
  closeModal('moProfile');
}

function enterApp(){
  g('AUTH').style.display = 'none';
  g('APP').classList.add('show');
  loadList();
}

// ══ TABS ══
window.switchTab = function(tab){
  curTab = tab;
  g('tabChats').classList.toggle('on', tab==='chats');
  g('tabChannels').classList.toggle('on', tab==='channels');
  g('btnNewChat').style.display = tab==='chats' ? 'flex' : 'none';
  g('btnNewChannel').style.display = tab==='channels' ? 'flex' : 'none';
  g('btnExplore').style.display = tab==='channels' ? 'flex' : 'none';
  loadList();
};

async function loadList(){
  if(curTab==='chats'){
    var r = await api('list_chats');
    if(r && r.success){ chatsCache = r.chats; renderSbList(); }
  } else {
    var r = await api('my_channels');
    if(r && r.success){ channelsCache = r.channels; renderSbList(); }
  }
}

function avatarEl(name, url, isChannel, size){
  size = size || 46;
  var colors = ['#5b8af5','#7c3aed','#e11d48','#0891b2','#059669','#d97706'];
  var color = colors[(name||'').charCodeAt(0) % colors.length];
  var shape = isChannel ? 'border-radius:13px' : '';
  if(url) return '<div class="av '+(isChannel?'channel':'')+'" style="width:'+size+'px;height:'+size+'px;'+shape+'"><img src="'+esc(url)+'" onerror="this.parentNode.innerHTML=\'<div class=av-text>'+esc(initials(name))+'</div>\'"></div>';
  return '<div class="av '+(isChannel?'channel':'')+'" style="width:'+size+'px;height:'+size+'px;background:'+color+';'+shape+'"><div class="av-text">'+esc(initials(name))+'</div></div>';
}

function renderSbList(){
  var list = curTab==='chats' ? chatsCache : channelsCache;
  var wrap = g('sbList');
  if(!list.length){
    wrap.innerHTML = '<div class="sb-empty"><i class="fas fa-'+(curTab==='chats'?'comment-slash':'broadcast-tower')+'"></i>'+(curTab==='chats'?'No chats yet. Start a new conversation!':'No channels yet. Explore or create one!')+'</div>';
    return;
  }
  wrap.innerHTML = list.map(function(item){
    var isChannel = curTab === 'channels';
    var name = isChannel ? item.name : (item.is_group ? item.name : (item.peer ? item.peer.display_name : 'Unknown'));
    var avatarUrl = isChannel ? item.avatar_url : (item.peer ? item.peer.avatar_url : null);
    var lastMsg = item.last_type === 'text' ? (item.last_message||'') : (item.last_type ? '📎 '+item.last_type : '');
    var activeId = curChat ? (curTab==='chats'?'c':  'ch') + item.id : '';
    var myId = (curTab==='chats'?'c':'ch') + item.id;
    return '<div class="sb-item'+(myId===activeId?' active':'')+'" onclick="openItem('+item.id+')" data-key="'+myId+'">'+
      avatarEl(name, avatarUrl, isChannel)+
      '<div class="sb-item-info">'+
        '<div class="sb-item-row1"><span class="sb-item-name">'+esc(name)+'</span><span class="sb-item-time">'+timeShort(item.last_at)+'</span></div>'+
        '<div class="sb-item-last">'+esc(lastMsg||'No messages yet')+'</div>'+
      '</div></div>';
  }).join('');
}

// ══ OPEN CHAT/CHANNEL ══
window.openItem = function(id){
  if(curTab==='chats') openChat(id);
  else openChannel(id);
};

function openChat(id){
  var chat = chatsCache.find(function(c){ return c.id===id; });
  if(!chat) return;
  var name = chat.is_group ? chat.name : (chat.peer ? chat.peer.display_name : 'Unknown');
  var avatarUrl = chat.peer ? chat.peer.avatar_url : null;
  curChat = {type:'chat', id:id, name:name, is_group:chat.is_group, peer:chat.peer, avatarUrl:avatarUrl};
  showChatUI(name, avatarUrl, false, chat.is_group?(chat.member_count+' members'):(chat.peer?'@'+chat.peer.username:''), true);
  loadMessages();
  startPoll();
}

async function openChannel(id){
  var chan = channelsCache.find(function(c){ return c.id===id; });
  if(!chan){ await loadList(); chan = channelsCache.find(function(c){ return c.id===id; }); }
  if(!chan) return;
  curChat = {type:'channel', id:id, name:chan.name, role:chan.role, post_mode:chan.post_mode, avatarUrl:chan.avatar_url};
  var canPost = chan.role==='owner' || chan.role==='admin' || chan.post_mode==='all';
  g('caMain').querySelector('.ca-input-area').style.display = canPost ? '' : 'none';
  showChatUI(chan.name, chan.avatar_url, true, '@'+chan.handle+' · '+chan.role, canPost);
  loadMessages();
  startPoll();
}

function showChatUI(name, avatarUrl, isChannel, sub, canInput){
  g('caPlaceholder').style.display = 'none';
  g('caMain').style.display = 'flex';
  g('caHeadName').textContent = name;
  g('caHeadSub').textContent = sub || '';
  var av = g('caHeadAv');
  av.innerHTML = '';
  if(avatarUrl){
    var img = document.createElement('img');
    img.src = avatarUrl;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover';
    img.onerror = function(){ av.textContent = initials(name); };
    av.appendChild(img);
  } else { av.textContent = initials(name); }
  if(isChannel) av.style.borderRadius = '11px'; else av.style.borderRadius = '50%';
  var colors = ['#5b8af5','#7c3aed','#e11d48','#0891b2','#059669','#d97706'];
  av.style.background = colors[(name||'').charCodeAt(0)%colors.length];
  if(isMobile){ g('SB').classList.add('hidden'); g('CA').classList.add('active'); }
  highlightSbItem();
}

function highlightSbItem(){
  if(!curChat) return;
  var key = (curChat.type==='chat'?'c':'ch') + curChat.id;
  document.querySelectorAll('.sb-item').forEach(function(el){ el.classList.remove('active'); });
  var el = document.querySelector('[data-key="'+key+'"]');
  if(el) el.classList.add('active');
}

window.closeChatMobile = function(){
  g('SB').classList.remove('hidden');
  g('CA').classList.remove('active');
  clearInterval(pollTimer);
};

// ══ MESSAGES ══
async function loadMessages(){
  if(!curChat) return;
  var action = curChat.type==='chat' ? 'get_messages' : 'get_channel_messages';
  var key = curChat.type==='chat' ? 'chat_id' : 'channel_id';
  var body = {limit:80};
  body[key] = curChat.id;
  var r = await api(action, body);
  if(!r || !r.success) return;
  renderMessages(r.messages);
}

function renderMessages(msgs){
  var wrap = g('caMsgs');
  var atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;
  if(!msgs.length){
    wrap.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:2rem">No messages yet. Say hello! 👋</div>';
    return;
  }
  var html = '';
  var lastDate = '';
  msgs.forEach(function(m){
    var d = new Date(m.created_at).toDateString();
    if(d !== lastDate){
      html += '<div class="msg-date-sep"><span>'+formatDate(m.created_at)+'</span></div>';
      lastDate = d;
    }
    html += buildMsgHtml(m);
  });
  wrap.innerHTML = html;
  if(atBottom) wrap.scrollTop = wrap.scrollHeight;
  // Long-press on mobile, right-click on desktop
  wrap.querySelectorAll('.bubble').forEach(function(b){
    b.addEventListener('contextmenu', function(e){ e.preventDefault(); showCtxMenu(e, b); });
    var pressTimer;
    b.addEventListener('touchstart', function(e){ pressTimer = setTimeout(function(){ showCtxMenu(e.touches[0], b); }, 500); }, {passive:true});
    b.addEventListener('touchend', function(){ clearTimeout(pressTimer); });
    b.addEventListener('touchmove', function(){ clearTimeout(pressTimer); });
  });
}

function buildMsgHtml(m){
  var mine = m.sender_id === ME.id;
  var html = '<div class="msg-row '+(mine?'mine':'other')+'" data-msg-id="'+m.id+'" data-msg-content="'+esc(m.content||'')+'" data-sender="'+esc(m.sender_name||'')+'" data-mine="'+(mine?1:0)+'">';
  if(!mine){
    var sav = avatarEl(m.sender_name, m.sender_avatar, false, 30);
    html += sav.replace('class="av','class="msg-av');
  }
  html += '<div class="msg-content">';
  if(!mine && (curChat.is_group || curChat.type==='channel'))
    html += '<div class="msg-sender-name">'+esc(m.sender_name)+'</div>';
  html += '<div class="bubble">';
  if(m.reply_to){
    html += '<div class="reply-preview" onclick="scrollToMsg('+m.reply_to.id+')"><div class="rp-name">'+esc(m.reply_to.sender_name)+'</div><div class="rp-text">'+esc(m.reply_to.content||'[Media]')+'</div></div>';
  }
  if(m.type==='image' && m.media_url) html += '<div class="bubble-media"><img src="'+esc(m.media_url)+'" loading="lazy" onclick="window.open(\''+esc(m.media_url)+'\',\'_blank\')"></div>';
  else if(m.type==='video' && m.media_url) html += '<div class="bubble-media"><video src="'+esc(m.media_url)+'" controls></video></div>';
  else if(m.type==='file' && m.media_url) html += '<div class="bubble-media"><div class="file-attach"><i class="fas fa-file"></i><a href="'+esc(m.media_url)+'" target="_blank" style="color:var(--accent)">'+esc(m.media_name||'File')+'</a></div></div>';
  if(m.content) html += '<div class="bubble-text">'+esc(m.content)+'</div>';
  html += '<div class="bubble-time">'+timeFull(m.created_at)+'</div>';
  html += '</div>';
  if(m.reactions && m.reactions.length){
    html += '<div class="bubble-reactions">';
    m.reactions.forEach(function(rx){
      html += '<div class="reaction-pill" onclick="reactQuick('+m.id+',\''+rx.emoji+'\')">'+rx.emoji+' <span class="rcount">'+rx.count+'</span></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function formatDate(ts){
  var d = new Date(ts), now = new Date();
  if(d.toDateString()===now.toDateString()) return 'Today';
  var yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
}

function scrollToMsg(id){
  var el = document.querySelector('[data-msg-id="'+id+'"]');
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.querySelector('.bubble').style.outline='2px solid var(--accent)'; setTimeout(function(){ el.querySelector('.bubble').style.outline=''; },1200); }
}

// ══ SEND ══
async function sendMessage(){
  var text = g('msgIn').value.trim();
  if(!text || !curChat) return;
  g('msgIn').value = ''; g('msgIn').style.height='auto';
  var action = curChat.type==='chat' ? 'send_message' : 'send_channel_message';
  var key = curChat.type==='chat' ? 'chat_id' : 'channel_id';
  var body = {type:'text', content:text};
  body[key] = curChat.id;
  if(replyingTo){ body.reply_to_id = replyingTo.id; clearReply(); }
  var r = await api(action, body);
  if(!r || !r.success){ toast(r?r.error:'Send failed','error'); return; }
  loadMessages();
  loadList();
}

function autoResizeTextarea(){
  var t = g('msgIn');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

// ══ FILE UPLOAD ══
async function handleFileSelect(input){
  var file = input.files[0];
  if(!file || !curChat) return;
  input.value = '';
  var ubar = g('uploadBar'), fill = g('uploadBarFill'), txt = g('uploadBarText');
  ubar.classList.add('vis');
  txt.textContent = 'Uploading '+file.name+'…';
  fill.style.width = '0%';
  var formData = new FormData();
  formData.append('file', file);
  try {
    var xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', function(e){
      if(e.lengthComputable) fill.style.width = (e.loaded/e.total*100)+'%';
    });
    xhr.open('POST', UPLOAD_API);
    xhr.onload = async function(){
      ubar.classList.remove('vis');
      var resp;
      try { resp = JSON.parse(xhr.responseText); } catch(e){ toast('Upload failed','error'); return; }
      if(!resp.success && !resp.id){ toast('Upload failed: '+(resp.error||'unknown'),'error'); return; }
      var fileId = resp.id || resp.fileId;
      var ext = file.name.lastIndexOf('.')!==-1 ? file.name.slice(file.name.lastIndexOf('.')) : '';
      var mediaUrl = BACKEND + '/btfstorage/server/' + fileId + ext;
      var type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
      var action = curChat.type==='chat' ? 'send_message' : 'send_channel_message';
      var key = curChat.type==='chat' ? 'chat_id' : 'channel_id';
      var body = {type:type, media_url:mediaUrl, media_name:file.name, content:''};
      body[key] = curChat.id;
      if(replyingTo){ body.reply_to_id = replyingTo.id; clearReply(); }
      var r = await api(action, body);
      if(!r || !r.success){ toast('Message send failed','error'); return; }
      toast('File sent!','success');
      loadMessages(); loadList();
    };
    xhr.onerror = function(){ ubar.classList.remove('vis'); toast('Upload failed','error'); };
    xhr.send(formData);
  } catch(e){ ubar.classList.remove('vis'); toast('Upload error: '+e.message,'error'); }
}

// ══ AVATAR UPLOAD ══
async function uploadAvatar(input){
  var file = input.files[0];
  if(!file) return;
  toast('Uploading avatar…','info');
  var formData = new FormData();
  formData.append('file', file);
  try {
    var r = await fetch(UPLOAD_API, {method:'POST', body:formData});
    var d = await r.json();
    if(!d.success && !d.id){ toast('Upload failed','error'); return; }
    var fileId = d.id || d.fileId;
    var ext = file.name.lastIndexOf('.')!==-1 ? file.name.slice(file.name.lastIndexOf('.')) : '.jpg';
    var url = BACKEND + '/btfstorage/server/' + fileId + ext;
    g('profileNameIn').dataset.avatarUrl = url;
    var big = g('profileAvBig');
    big.innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
    toast('Avatar uploaded!','success');
  } catch(e){ toast('Upload error','error'); }
}

// ══ REPLY ══
window.clearReply = function(){
  replyingTo = null;
  g('replyBar').classList.remove('vis');
};

function setReply(m){
  replyingTo = m;
  g('replyBar').classList.add('vis');
  g('replyBarName').textContent = m.sender_name || m.sender_username || 'Unknown';
  g('replyBarText').textContent = m.content || '[Media]';
  g('msgIn').focus();
}

// ══ CONTEXT MENU ══
var ctxMsgData = null;
function showCtxMenu(e, bubbleEl){
  var row = bubbleEl.closest('.msg-row');
  ctxMsgData = {
    id: +row.dataset.msgId,
    content: row.dataset.msgContent,
    sender: row.dataset.sender,
    mine: row.dataset.mine === '1'
  };
  var menu = g('ctxMenu');
  g('ctxDelete').style.display = ctxMsgData.mine ? 'flex' : 'none';
  menu.classList.add('vis');
  var x = (e.clientX||e.pageX||0), y = (e.clientY||e.pageY||0);
  var mw = 180, mh = 200;
  x = Math.min(x, window.innerWidth - mw - 8);
  y = Math.min(y, window.innerHeight - mh - 8);
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
}
function hideCtxMenu(){ g('ctxMenu').classList.remove('vis'); ctxMsgData = null; }

window.replyToCtx = function(){
  if(!ctxMsgData) return;
  setReply({id:ctxMsgData.id, sender_name:ctxMsgData.sender, content:ctxMsgData.content});
  hideCtxMenu();
};
window.copyCtxText = function(){
  if(!ctxMsgData) return;
  navigator.clipboard && navigator.clipboard.writeText(ctxMsgData.content||'');
  toast('Copied!','info'); hideCtxMenu();
};
window.deleteCtxMsg = async function(){
  if(!ctxMsgData || !ctxMsgData.mine) return;
  var action = curChat.type==='chat' ? 'delete_message' : 'delete_channel_message';
  var r = await api(action, {message_id:ctxMsgData.id});
  if(r && r.success){ toast('Deleted','info'); loadMessages(); }
  else toast('Delete failed','error');
  hideCtxMenu();
};
window.reactMsg = async function(emoji){
  if(!ctxMsgData) return;
  var action = curChat.type==='chat' ? 'react_message' : 'react_channel_message';
  var r = await api(action, {message_id:ctxMsgData.id, emoji:emoji});
  if(r && r.success) loadMessages();
  hideCtxMenu();
};
window.reactQuick = async function(msgId, emoji){
  var action = curChat.type==='chat' ? 'react_message' : 'react_channel_message';
  await api(action, {message_id:msgId, emoji:emoji});
  loadMessages();
};

// ══ EMOJI PICKER ══
window.toggleEmojiPicker = function(){
  g('emojiPicker').classList.toggle('vis');
};
window.insertEmoji = function(e){
  var t = g('msgIn');
  var s = t.selectionStart, en = t.selectionEnd;
  t.value = t.value.slice(0,s) + e + t.value.slice(en);
  t.selectionStart = t.selectionEnd = s + e.length;
  t.focus(); autoResizeTextarea();
  g('emojiPicker').classList.remove('vis');
};

// ══ NEW CHAT / GROUP ══
window.openNewItem = function(){
  if(curTab === 'chats') openModal('moNewChat');
  else openModal('moNewChannel');
};
var userSearchDebounce = null;
window.searchUsers = function(q){
  clearTimeout(userSearchDebounce);
  userSearchDebounce = setTimeout(async function(){
    var res = g('userSearchResults');
    if(!q.trim()){ res.innerHTML = ''; return; }
    var r = await api('search_users', {q:q});
    if(!r || !r.success) return;
    res.innerHTML = r.users.length
      ? r.users.map(function(u){
          return '<div class="sr-item" onclick="startDM(\''+esc(u.username)+'\')">'+
            avatarEl(u.display_name, u.avatar_url, false, 36)+
            '<div><div class="sr-item-name">'+esc(u.display_name)+'</div><div class="sr-item-user">@'+esc(u.username)+'</div></div></div>';
        }).join('')
      : '<div style="padding:.7rem;color:var(--muted);font-size:.78rem">No users found</div>';
  }, 300);
};
window.startDM = async function(username){
  closeModal('moNewChat');
  var r = await api('create_chat', {is_group:false, peer_username:username});
  if(!r || !r.success){ toast(r?r.error:'Failed','error'); return; }
  await loadList();
  openChat(r.chat_id);
};
window.createGroup = async function(){
  var name = g('groupNameIn').value.trim();
  if(!name){ toast('Enter group name','error'); return; }
  var r = await api('create_chat', {is_group:true, name:name, member_usernames:[]});
  if(!r || !r.success){ toast(r?r.error:'Failed','error'); return; }
  closeModal('moNewChat');
  await loadList();
  openChat(r.chat_id);
};

// ══ CHANNELS ══
window.createChannel = async function(){
  var name = g('chNameIn').value.trim(), handle = g('chHandleIn').value.trim();
  if(!name || !handle){ toast('Name and handle required','error'); return; }
  var r = await api('create_channel', {
    name:name, handle:handle.replace(/^@/,''),
    description:g('chDescIn').value.trim(),
    post_mode: g('chPostMode').value
  });
  if(!r || !r.success){ toast(r?r.error:'Failed','error'); return; }
  toast('Channel created!','success');
  closeModal('moNewChannel'); switchTab('channels');
  await loadList(); openChannel(r.channel_id);
};
window.openExplore = function(){ g('exploreIn').value=''; searchChannels(''); openModal('moExplore'); };
var exploreDebounce = null;
window.searchChannels = function(q){
  clearTimeout(exploreDebounce);
  exploreDebounce = setTimeout(async function(){
    var r = await api('list_channels', {q:q});
    if(!r || !r.success) return;
    g('exploreResults').innerHTML = r.channels.length
      ? r.channels.map(function(c){
          return '<div class="sr-item">'+
            avatarEl(c.name, c.avatar_url, true, 36)+
            '<div style="flex:1;min-width:0"><div class="sr-item-name">'+esc(c.name)+'</div><div class="sr-item-user">@'+esc(c.handle)+' · '+c.member_count+' members</div></div>'+
            (c.joined
              ? '<span style="font-size:.68rem;color:var(--green);font-weight:700">✓ Joined</span>'
              : '<button class="modal-btn primary" style="width:auto;padding:.3rem .7rem;font-size:.72rem;margin:0" onclick="joinCh('+c.id+')">Join</button>')+
          '</div>';
        }).join('')
      : '<div style="padding:.7rem;color:var(--muted);font-size:.78rem">No channels found</div>';
  }, 300);
};
window.joinCh = async function(id){
  var r = await api('join_channel', {channel_id:id});
  if(r && r.success){ toast('Joined!','success'); searchChannels(g('exploreIn').value); loadList(); }
};

// ══ PROFILE ══
window.openProfile = function(){
  if(!ME) return;
  var big = g('profileAvBig');
  if(ME.avatar_url) big.innerHTML = '<img src="'+ME.avatar_url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  else { big.textContent = initials(ME.display_name); big.style.background = '#5b8af5'; big.style.fontSize = '2rem'; }
  g('profileNameIn').value = ME.display_name;
  openModal('moProfile');
};
window.saveProfile = async function(){
  var name = g('profileNameIn').value.trim();
  var avatarUrl = g('profileNameIn').dataset.avatarUrl || null;
  var body = {};
  if(name && name !== ME.display_name) body.display_name = name;
  if(avatarUrl) body.avatar_url = avatarUrl;
  if(!Object.keys(body).length){ closeModal('moProfile'); return; }
  var r = await api('update_profile', body);
  if(!r || !r.success){ toast(r?r.error:'Failed','error'); return; }
  ME = r.user; delete g('profileNameIn').dataset.avatarUrl;
  toast('Profile updated!','success'); closeModal('moProfile'); loadList();
};

// ══ CHAT INFO ══
window.openChatInfo = async function(){
  if(!curChat) return;
  var body = g('chatInfoBody');
  if(curChat.type === 'channel'){
    body.innerHTML = '<div class="modal-title"><i class="fas fa-broadcast-tower" style="color:var(--accent)"></i> '+esc(curChat.name)+'</div><div style="color:var(--muted);font-size:.8rem;margin-bottom:1rem">Loading members…</div>';
    openModal('moChatInfo');
    var r = await api('channel_members', {channel_id:curChat.id});
    if(!r || !r.success) return;
    var canManage = r.my_role === 'owner';
    body.innerHTML = '<div class="modal-title"><i class="fas fa-broadcast-tower" style="color:var(--accent)"></i> '+esc(curChat.name)+'</div>'+
      '<div style="font-size:.72rem;color:var(--muted);margin-bottom:.8rem">'+r.members.length+' members · My role: '+r.my_role+'</div>'+
      r.members.map(function(m){
        return '<div class="member-item">'+avatarEl(m.display_name, m.avatar_url, false, 34)+
          '<div><div style="font-size:.82rem;font-weight:600">'+esc(m.display_name)+'</div><div style="font-size:.68rem;color:var(--muted)">@'+esc(m.username)+'</div></div>'+
          '<span class="member-role '+m.role+'">'+m.role+'</span>'+
          (canManage && m.user_id !== ME.id ? '<button class="sb-icon-btn" onclick="toggleAdmin('+curChat.id+','+m.user_id+',\''+m.role+'\')" title="Toggle admin"><i class="fas fa-user-'+(m.role==='admin'?'minus':'plus')+'"></i></button>' : '')+
        '</div>';
      }).join('');
    if(r.my_role !== 'owner'){
      body.innerHTML += '<button class="modal-btn danger" onclick="leaveChannel('+curChat.id+')" style="margin-top:.8rem"><i class="fas fa-right-from-bracket"></i> Leave Channel</button>';
    }
  } else {
    body.innerHTML = '<div class="modal-title">'+esc(curChat.name)+'</div>'+
      (curChat.peer ? '<div style="color:var(--muted);font-size:.8rem">@'+esc(curChat.peer.username)+'</div>' : '')+
      (curChat.is_group ? '<div style="color:var(--muted);font-size:.78rem;margin-top:.5rem">Group chat</div>' : '');
    openModal('moChatInfo');
  }
};
window.toggleAdmin = async function(channelId, userId, curRole){
  var newRole = curRole === 'admin' ? 'member' : 'admin';
  var r = await api('update_channel_member', {channel_id:channelId, target_user_id:userId, role:newRole});
  if(r && r.success){ toast('Role updated','success'); openChatInfo(); }
};
window.leaveChannel = async function(id){
  if(!confirm('Leave this channel?')) return;
  var r = await api('leave_channel', {channel_id:id});
  if(r && r.success){ closeModal('moChatInfo'); toast('Left channel','info'); curChat=null; g('caMain').style.display='none'; g('caPlaceholder').style.display='flex'; loadList(); }
};

// ══ SEARCH SIDEBAR ══
window.onSbSearch = function(q){
  if(!q.trim()){ renderSbList(); return; }
  var ql = q.toLowerCase();
  var list = curTab==='chats'
    ? chatsCache.filter(function(c){ return (c.name||'').toLowerCase().includes(ql) || (c.peer&&c.peer.display_name.toLowerCase().includes(ql)); })
    : channelsCache.filter(function(c){ return c.name.toLowerCase().includes(ql) || c.handle.toLowerCase().includes(ql); });
  var tmp = curTab==='chats' ? chatsCache : channelsCache;
  if(curTab==='chats') chatsCache = list; else channelsCache = list;
  renderSbList();
  if(curTab==='chats') chatsCache = tmp; else channelsCache = tmp;
};

// ══ POLL ══
function startPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(function(){ if(curChat) loadMessages(); }, 3000);
}

// ══ MODALS ══
window.openModal = function(id){ g(id).classList.add('on'); };
window.closeModal = function(id){ g(id).classList.remove('on'); };
</script>
