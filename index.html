<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<title>NexaGram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#0d1724;
  --bg1:#111f30;
  --bg2:#162030;
  --bg3:#1a2840;
  --border:#243450;
  --text:#e8edf5;
  --muted:#7a92b0;
  --muted2:#4a6080;
  --accent:#3a7bd5;
  --accentD:#2a5da8;
  --green:#2ecc71;
  --red:#e74c3c;
  --redD:#8b1a1a;
  --bme:#1e4a7a;
  --bother:#1a2c42;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --surface:#1d2a39;
  --shadow:rgba(0,0,0,0.5);
  --ring:rgba(82,136,193,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;resize:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:2px}

/* ── TOASTS ── */
#TOAST{position:fixed;top:calc(var(--safe-t) + 12px);right:12px;z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;max-width:280px;box-shadow:0 4px 20px var(--shadow);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;pointer-events:all}
.toast.err{border-color:var(--red);color:#f99}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

/* ── CONNECTIVITY BANNER ── */
#CONN{position:fixed;top:0;left:0;right:0;z-index:1500;background:linear-gradient(90deg,#7b1c1c,#c0392b);color:#fff;font-size:13px;font-weight:600;text-align:center;padding:8px 12px;cursor:pointer;display:none;animation:connSlide .4s ease}
#CONN.show{display:block}
@keyframes connSlide{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* ── APP SHELL ── */
#APP{display:flex;height:100%;padding-top:var(--safe-t)}
#SIDE{width:320px;min-width:280px;max-width:340px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg1);transition:transform .25s ease}
#MAIN{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* ── AUTH ── */
#AUTH{display:flex;align-items:center;justify-content:center;height:100%;padding:20px}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 40px var(--shadow)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.auth-logo .icon-wrap{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accentD));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(58,123,213,.45)}
.auth-logo h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.auth-logo span{color:var(--accent)}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border-radius:7px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer}
.auth-tab.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(58,123,213,.4)}
.auth-field{position:relative;margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.auth-field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-size:14px;transition:border .2s,box-shadow .2s}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.auth-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accentD));color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:10px;margin-top:8px;transition:opacity .2s,transform .1s;box-shadow:0 4px 16px rgba(58,123,213,.35)}
.auth-btn:active{transform:scale(.98);opacity:.9}
.auth-err{color:#f99;font-size:13px;text-align:center;margin-top:10px;display:none}

/* ── SIDEBAR HEADER ── */
#sHd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border);background:rgba(13,23,36,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#sHd .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;cursor:pointer;border:2px solid var(--border);transition:border-color .2s}
#sHd .av:hover{border-color:var(--accent)}
#sHd .uname{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sHd .hbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:15px}
#sHd .hbtn:hover{background:var(--surface);color:var(--text)}

/* ── SEARCH ── */
#sSearch{padding:8px 12px;border-bottom:1px solid var(--border)}
#sSearch .wrap{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;transition:border .2s,box-shadow .2s}
#sSearch .wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#sSearch .wrap i{color:var(--muted);font-size:13px}
#srchIn{flex:1;font-size:13px}
#srchIn::placeholder{color:var(--muted2)}
#srchRes{padding:4px 8px;max-height:180px;overflow-y:auto}
.srch-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;transition:background .15s}
.srch-item:hover{background:var(--surface)}
.srch-item .sav{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.srch-item .sname{font-size:13px;font-weight:600}
.srch-item .sdesc{font-size:11px;color:var(--muted)}

/* ── TABS ── */
#sTabs{display:flex;padding:6px 8px;gap:4px;border-bottom:1px solid var(--border);background:var(--bg1)}
.stab{flex:1;padding:7px 4px;border-radius:8px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;cursor:pointer;position:relative}
.stab.act{background:var(--surface);color:var(--accent)}
.stab .tbadge{position:absolute;top:3px;right:6px;background:var(--red);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px}

/* ── LIST ── */
#LIST{flex:1;overflow-y:auto;padding:4px}
.li{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative}
.li:hover{background:var(--surface)}
.li.act{background:var(--bg3);border:1px solid var(--border)}
.li .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;position:relative}
.li .av.ch{border-radius:12px;background:linear-gradient(135deg,#2e86ab,#1a5272)}
.li .info{flex:1;min-width:0}
.li .lname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.li .ltime{font-size:10px;color:var(--muted2);flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.li .ltime .ts{white-space:nowrap}
/* unread badge */
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg1);flex-shrink:0}
.unread-badge{background:var(--green);color:#fff;font-size:9px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.li.unread .lname{font-weight:700}
.li.unread .lsub{color:var(--text)}

/* ── MAIN HEADER ── */
#mHd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(13,23,36,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0;min-height:60px}
#mHd .back{display:none;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:background .2s}
#mHd .back:hover{background:var(--surface)}
#mHd .av2{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a56a0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
#mHd .av2.ch{border-radius:10px;background:linear-gradient(135deg,#2e86ab,#1a5272)}
#mHd .info2{flex:1;min-width:0}
#mHd .info2 .n2{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mHd .info2 .s2{font-size:11px;color:var(--muted)}
#mHd .hbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:15px}
#mHd .hbtn:hover{background:var(--surface);color:var(--text)}

/* ── PLACEHOLDER ── */
#PH{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:12px}
#PH .icon{width:72px;height:72px;border-radius:20px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted2)}
#PH p{font-size:15px}

/* ── MESSAGES ── */
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;position:relative}
.bub{max-width:72%;display:flex;flex-direction:column;gap:3px;animation:bubIn .22s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.ot{align-self:flex-start;align-items:flex-start}
.bub .bsender{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.bub .bcont{background:var(--bother);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;line-height:1.5;position:relative;word-break:break-word}
.bub.me .bcont{background:var(--bme);border-radius:16px 16px 4px 16px}
.bub.pending .bcont{opacity:.65}
.bub.failed .bcont{background:var(--redD);border:1px solid var(--red)}
.bub .btime{font-size:10px;color:var(--muted);margin-top:1px}
.bub .retry{color:var(--accent);cursor:pointer;font-weight:600;margin-left:4px}
.bub .retry:hover{text-decoration:underline}
.bub .brep{background:rgba(0,0,0,.2);border-left:3px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);margin-bottom:5px;cursor:pointer;transition:background .15s,transform .15s;max-width:100%}
.bub .brep:hover{background:rgba(58,123,213,.15);transform:translateY(-1px)}
.bub .bimg{max-width:260px;max-height:220px;border-radius:10px;object-fit:cover;cursor:pointer;transition:transform .2s;display:block}
.bub .bimg:hover{transform:scale(1.02)}
.bub .breact{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bub .react-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;transition:background .15s}
.bub .react-btn:hover{background:rgba(58,123,213,.2)}
.react-picker{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;gap:6px;z-index:100;box-shadow:0 8px 24px var(--shadow);animation:bubIn .15s ease}
.react-pick-em{font-size:20px;cursor:pointer;transition:transform .15s}
.react-pick-em:hover{transform:scale(1.3)}
.dayDiv{text-align:center;margin:8px 0}
.dayDiv span{background:var(--bg3);color:var(--muted);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border)}

/* ── REPLY STRIP ── */
#repStrip{display:none;align-items:center;gap:10px;padding:8px 16px;background:var(--bg3);border-top:1px solid var(--border);font-size:13px}
#repStrip .rtxt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#repStrip .rtxt strong{color:var(--text)}
#repStrip button{color:var(--muted);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:background .15s}
#repStrip button:hover{background:var(--surface)}

/* ── INPUT BAR ── */
#inputBar{padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.ibar-inner{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 14px;transition:border .2s,box-shadow .2s}
.ibar-inner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#msgIn{flex:1;max-height:140px;overflow-y:auto;font-size:14px;line-height:1.5;padding:2px 0}
#msgIn::placeholder{color:var(--muted2)}
.ibar-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s;font-size:16px;flex-shrink:0}
.ibar-btn:hover{background:var(--surface);color:var(--text)}
.ibar-send{background:var(--accent);color:#fff;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:background .2s,transform .1s;box-shadow:0 2px 8px rgba(58,123,213,.4)}
.ibar-send:hover{background:var(--accentD)}
.ibar-send:active{transform:scale(.95)}
#fileIn{display:none}

/* ── CHANNEL CREATE / INFO PANELS ── */
#chanPane,#profPane{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#chanPane.show,#profPane.show{display:flex}
.pane-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:380px;padding:28px 24px;box-shadow:0 12px 48px var(--shadow)}
.pane-box h3{font-size:17px;font-weight:700;margin-bottom:18px}
.pane-field{margin-bottom:14px}
.pane-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.pane-field input,.pane-field textarea,.pane-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--text);transition:border .2s,box-shadow .2s}
.pane-field input:focus,.pane-field textarea:focus,.pane-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);outline:none}
.pane-field textarea{resize:vertical;min-height:72px}
.pane-row{display:flex;gap:10px;margin-top:4px}
.pane-btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;transition:opacity .2s}
.pane-btn.prim{background:var(--accent);color:#fff}
.pane-btn.sec{background:var(--bg3);color:var(--muted)}

/* ── LIGHTBOX (A1) ── */
#LB{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
#LB.show{display:flex}
#LB .lb-img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:10px;transition:transform .2s;touch-action:pinch-zoom}
#LB .lb-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;transition:background .2s}
#LB .lb-close:hover{background:rgba(255,255,255,.2)}
#LB .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;transition:background .2s}
#LB .lb-nav:hover{background:rgba(255,255,255,.18)}
#LB .lb-prev{left:12px}
#LB .lb-next{right:12px}
#LB .lb-caption{color:rgba(255,255,255,.5);font-size:12px;margin-top:10px}

/* ── DRAG OVERLAY (A2) ── */
#DRAGOV{position:fixed;inset:0;z-index:1050;background:rgba(13,23,36,.85);display:none;align-items:center;justify-content:center;border:3px dashed var(--accent);pointer-events:none}
#DRAGOV.show{display:flex}
#DRAGOV>div{text-align:center;color:var(--accent);font-size:15px;font-weight:700}
#DRAGOV>div i{font-size:48px;margin-bottom:12px;display:block}
body.drag-active #DRAGOV{display:flex}

/* ── REP-JUMP PILL (A8) ── */
.repjump{position:sticky;top:6px;z-index:50;align-self:center;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);cursor:pointer;box-shadow:0 2px 10px var(--shadow);transition:background .2s,color .2s;animation:bubIn .2s ease;margin-bottom:4px}
.repjump:hover{background:var(--surface);color:var(--text)}

/* ── MEMBERS PANEL ── */
#membersPane{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#membersPane.show{display:flex}
#membersPane .pane-box{max-height:80vh;overflow-y:auto}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border:none}
.member-row .mav{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.member-row .mname{flex:1;font-size:14px;font-weight:600}
.member-row .mrole{font-size:11px;color:var(--accent);font-weight:700}

/* ── MOBILE ── */
@media(max-width:680px){
  #SIDE{position:fixed;inset:0;width:100%;z-index:200;transform:translateX(0);transition:transform .25s ease}
  #SIDE.hide{transform:translateX(-100%)}
  #MAIN{position:fixed;inset:0}
  #mHd .back{display:flex}
  #APP{position:relative}
}
</style>
</head>
<body>

<div id="CONN" onclick="ng_connRetry()">No connection — tap to retry</div>
<div id="TOAST"></div>

<!-- ── LIGHTBOX ── -->
<div id="LB">
  <div class="lb-close" onclick="ng_closeLightbox()"><i class="fas fa-times"></i></div>
  <div class="lb-nav lb-prev" onclick="ng_prevImg()"><i class="fas fa-chevron-left"></i></div>
  <img class="lb-img" id="LB_IMG" src="" alt=""/>
  <div class="lb-nav lb-next" onclick="ng_nextImg()"><i class="fas fa-chevron-right"></i></div>
  <div class="lb-caption" id="LB_CAP"></div>
</div>

<!-- ── DRAG OVERLAY ── -->
<div id="DRAGOV">
  <div>
    <i class="fas fa-cloud-upload-alt"></i>
    Drop to upload
  </div>
</div>

<!-- ── AUTH ── -->
<div id="AUTH">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon-wrap"><i class="fas fa-paper-plane"></i></div>
      <h1>Nexa<span>Gram</span></h1>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab act" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
      <div class="auth-tab" id="tabReg" onclick="switchAuthTab('reg')">Register</div>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>Username</label><input id="inUser" placeholder="your_username" autocomplete="username"/></div>
      <div class="auth-field"><label>Password</label><input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="auth-btn" onclick="doLogin()">Sign In</button>
    </div>
    <div id="regForm" style="display:none">
      <div class="auth-field"><label>Username</label><input id="inRegUser" placeholder="choose_username" autocomplete="username"/></div>

<!-- index.html - Updated auth & messaging JS using action-based API -->
<!-- All the HTML/CSS above stays exactly the same -->

<script>
// ============================================================
// NEXAGRAM — Updated JS to work with existing Cloudflare backend
// ============================================================
(function(){
'use strict';

const API_BASE = 'https://marya-hosting.pages.dev/btfstorage/chat';
const STORAGE  = localStorage;

let currentUser = null;
let currentChatId = null;
let currentChat = null;
let chats = {};
let messages = {};
let contextTarget = null;
let replyData = null;
let isRegister = false;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function apiCall(action, body = {}, noAuth = false) {
  const headers = {'Content-Type': 'application/json'};
  if (!noAuth && currentUser?.token) {
    headers['X-Session-Token'] = currentUser.token;
  }
  return fetch(API_BASE, {
    method: 'POST',
    headers,
    body: JSON.stringify({action, ...body})
  }).then(r => r.json()).then(data => {
    if (data.error === 'Unauthorized') logout();
    return data;
  }).catch(err => {
    console.error('API Error:', err);
    return {success: false, error: err.message || 'Network error'};
  });
}

function loadSession() {
  const u = STORAGE.getItem('nexagram_user');
  if (u) try { return JSON.parse(u); } catch {}
  return null;
}

function saveSession(u) { STORAGE.setItem('nexagram_user', JSON.stringify(u)); }
function clearSession() { STORAGE.removeItem('nexagram_user'); }

function showToast(msg, type = 'info') {
  const existing = $('#toast-container');
  if (!existing) {
    const tc = document.createElement('div');
    tc.id = 'toast-container';
    tc.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;';
    document.body.appendChild(tc);
  }
  
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.style.cssText = `
    display:flex;align-items:center;gap:12px;
    padding:13px 16px;background:rgba(19,20,29,0.9);
    border:1px solid rgba(255,255,255,0.1);left-radius:8px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    font-size:13.5px;font-weight:500;color:#fff;
    min-width:260px;max-width:360px;
    animation:toastIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    border-left:4px solid ${type === 'success' ? '#23d18b' : type === 'error' ? '#f04f5a' : '#5865f2'};
  `;
  toast.textContent = msg;
  $('#toast-container').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// AUTH
function showAuth() { $('#auth-screen').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp() { $('#auth-screen').classList.add('hidden'); $('#app').classList.remove('hidden'); }

function updateAuthToggle() {
  const isLogin = !isRegister;
  $('#auth-title').textContent = isLogin ? 'Welcome back' : 'Create account';
  $('#auth-subtitle').textContent = isLogin ? 'Sign in to continue to NexaGram' : 'Join NexaGram today';
  $('#auth-btn').textContent = isLogin ? 'Sign In' : 'Create Account';
  $('#auth-switch-link').textContent = isLogin ? 'Create account' : 'Sign in instead';
  $('#auth-display-field').style.display = isRegister ? 'block' : 'none';
  $('#auth-error').style.display = 'none';
}

$('#auth-switch-link').addEventListener('click', () => {
  isRegister = !isRegister;
  updateAuthToggle();
});

$('#auth-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#auth-btn').click();
});

$('#auth-btn').addEventListener('click', async () => {
  const username = $('#auth-username').value.trim();
  const password = $('#auth-password').value;
  const display  = $('#auth-display').value.trim();
  const errEl    = $('#auth-error');
  errEl.style.display = 'none';
  
  if (!username || !password) {
    errEl.textContent = 'Username and password required';
    errEl.style.display = 'block';
    return;
  }
  if (isRegister && !display) {
    errEl.textContent = 'Display name required';
    errEl.style.display = 'block';
    return;
  }
  
  const btn = $('#auth-btn');
  btn.disabled = true;
  btn.textContent = 'Please wait...';
  
  try {
    const endpoint = isRegister ? 'register' : 'login';
    const body = isRegister 
      ? {username, password, display_name: display} 
      : {username, password};
    
    const data = await apiCall(endpoint, body, true);
    
    if (data.success && data.token) {
      currentUser = {token: data.token, ...data.user};
      saveSession(currentUser);
      showApp();
      initApp();
    } else {
      errEl.textContent = data.error || 'Login failed';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = isRegister ? 'Create Account' : 'Sign In';
  }
});

// APP INIT
function initApp() {
  loadChats();
  initEmojiPicker();
  initBottomSheets();
}

// CHAT LIST
async function loadChats() {
  try {
    const data = await apiCall('list_chats');
    if (data.success && data.chats) {
      data.chats.forEach(c => { 
        chats[c.id] = c;
        // For direct chats, set name from peer
        if (!c.is_group && c.peer) {
          c.name = c.peer.display_name || 'Unknown';
          c.online = Math.random() > 0.5; // Simulated
        }
        if (c.is_group) {
          c.name = c.name || 'Group';
        }
      });
      renderChatList();
    }
  } catch(e) {
    console.warn('loadChats', e);
  }
}

function renderChatList(filter='all', query='') {
  const container = $('#chat-list-container');
  container.innerHTML = '';
  
  const list = Object.values(chats).filter(c => {
    if (filter === 'direct')    return !c.is_group;
    if (filter === 'groups')   return c.is_group;
    if (filter === 'channels') return false;
    return true;
  }).filter(c => !query || (c.name||'').toLowerCase().includes(query.toLowerCase()));

  if (!list.length) {
    container.innerHTML = '<div class="chat-section-label" style="text-align:center;padding:32px 16px">No conversations yet</div>';
    return;
  }

  list.sort((a,b) => (b.last_at || b.created_at || 0) - (a.last_at || a.created_at || 0));

  list.forEach(chat => {
    const item = document.createElement('div');
    item.className = `chat-item${currentChatId === chat.id ? ' active' : ''}`;
    item.dataset.id = chat.id;
    item.onclick = () => openChat(chat);

    const avWrap = document.createElement('div');
    avWrap.className = 'avatar';
    const avImg = document.createElement('div');
    avImg.className = `avatar-img ${avatarColor(chat.name)}`;
    avImg.textContent = initials(chat.name);
    avWrap.appendChild(avImg);
    if (!chat.is_group && chat.online) {
      avWrap.innerHTML += '<div class="online-dot"></div>';
    }
    item.appendChild(avWrap);

    const info = document.createElement('div');
    info.className = 'chat-item-info';
    
    const row1 = document.createElement('div');
    row1.className = 'chat-item-row1';
    const nameEl = document.createElement('span');
    nameEl.className = 'chat-item-name';
    nameEl.textContent = chat.name || 'Unnamed';
    const timeEl = document.createElement('span');
    timeEl.className = 'chat-item-time';
    timeEl.textContent = fmtTime(chat.last_at || chat.created_at);
    row1.append(nameEl, timeEl);

    const row2 = document.createElement('div');
    row2.className = 'chat-item-row2';
    const prev = document.createElement('span');
    prev.className = 'chat-item-preview';
    prev.textContent = chat.last_message || 'No messages yet';
    row2.appendChild(prev);

    info.append(row1, row2);
    item.appendChild(info);
    container.appendChild(item);
  });
}

// Tabs
$$('.sidebar-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.sidebar-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderChatList(tab.dataset.tab, $('#sidebar-search-input').value);
  });
});

// Search
$('#sidebar-search-btn').addEventListener('click', toggleSearchBar);
function toggleSearchBar() {
  const bar = $('#sidebar-search-bar');
  bar.classList.toggle('hidden');
  if (!bar.classList.contains('hidden')) {
    $('#sidebar-search-input').focus();
  } else {
    renderChatList();
  }
}
$('#sidebar-search-input').addEventListener('input', e => {
  const active = $('.sidebar-tab.active');
  renderChatList(active?.dataset.tab || 'all', e.target.value);
});

// OPEN CHAT
async function openChat(chat) {
  if (typeof chat === 'number' || typeof chat === 'string') {
    chat = chats[chat];
  }
  if (!chat) return;
  
  currentChatId = chat.id;
  currentChat = chat;
  
  $('#empty-state').classList.add('hidden');
  $('#chat-view').classList.remove('hidden');
  
  // Header
  const avEl = $('#chat-header-avatar-img');
  avEl.className = `avatar-img ${avatarColor(chat.name)}`;
  avEl.textContent = initials(chat.name);
  $('#chat-header-name').textContent = chat.name || 'Chat';
  
  const statusEl = $('#chat-header-status');
  if (chat.is_group) {
    statusEl.textContent = `${chat.member_count || 2} members`;
    statusEl.className = '';
    $('#chat-input-area').classList.remove('hidden');
    $('#channel-input-placeholder').classList.add('hidden');
  } else {
    statusEl.textContent = chat.online ? 'online' : 'offline';
    statusEl.className = chat.online ? 'online' : '';
    $('#chat-input-area').classList.remove('hidden');
    $('#channel-input-placeholder').classList.add('hidden');
  }
  
  // Update sidebar active state
  $$('.chat-item').forEach(i => {
    i.classList.toggle('active', i.dataset.id == chat.id);
  });
  
  // Load messages
  messages[chat.id] = [];
  await loadMessages();
}
function renderChatList(){}

// MESSAGES
async function loadMessages() {
  if (!currentChat || !currentChat.id) return;
  
  const action = currentChat.type === 'channel' ? 'get_channel_messages' : 'get_messages';
  const key = currentChat.type === 'channel' ? 'channel_id' : 'chat_id';
  
  const data = await apiCall(action, {[key]: currentChat.id, limit: 50});
  
  if (data.success && data.messages) {
    messages[currentChat.id] = data.messages;
    renderMessages(data.messages);
  }
}

function renderMessages(msgs) {
  const container = $('#messages-container');
  
  if (!msgs.length) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:32px 16px">No messages yet. Say hello! 👋</div>';
    return;
  }
  
  let html = '';
  let lastDate = '';
  
  msgs.forEach(msg => {
    const msgDate = new Date(msg.created_at).toDateString();
    if (msgDate !== lastDate) {
      html += `<div class="date-separator"><div class="date-separator-line"></div><span class="date-separator-label">${fmtDate(msg.created_at)}</span><div class="date-separator-line"></div></div>`;
      lastDate = msgDate;
    }
    
    const mine = msg.sender_id === currentUser.id;
    html += renderMessage(msg, mine);
  });
  
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function renderMessages() {}

function renderMessage(msg, mine) {
  const time = fmtTime(msg.created_at);
  const senderName = msg.sender_name || 'Unknown';
  
  let contentHtml = '';
  if (msg.type === 'image' && msg.media_url) {
    contentHtml = `<img src="${msg.media_url}" class="message-media" loading="lazy" onclick="openLightbox('${msg.media_url}')">`;
  } else if (msg.type === 'video' && msg.media_url) {
    contentHtml = `<video src="${msg.media_url}" class="message-media" controls preload="none"></video>`;
  } else if (msg.type === 'file' && msg.media_url) {
    const fileName = msg.media_name || 'File';
    const fileExt = fileName.split('.').pop() || 'file';
    contentHtml = `<div class="message-file"><div class="file-icon-wrap"><i class="fas fa-file"></i></div><div class="file-details"><div class="file-name">${fileExt.toUpperCase()} • ${fileName}</div><div class="file-size">${formatFileSize(msg.media_url)}</div></div></div>`;
  } else {
    const content = msg.content || '';
    const contentEscaped = escHtml(content);
    contentHtml = `<div class="btxt">${contentEscaped}</div>`;
  }
  
  // Reply
  let replyHtml = '';
  if (msg.reply_to) {
    replyHtml = `<div class="reply-preview">
      <div class="reply-sender">${escHtml(msg.reply_to.sender_name || '')}</div>
      <div class="reply-text">${escHtml(msg.reply_to.content || '[Media]')}</div>
    </div>`;
  }
  
  // Reactions
  let reactionsHtml = '';
  if (msg.reactions && msg.reactions.length) {
    reactionsHtml = '<div class="reactions-row">';
    msg.reactions.forEach(rx => {
      reactionsHtml += `<div class="reaction-pill" onclick="reactToMessage(${msg.id}, '${rx.emoji}')">${rx.emoji} <span class="reaction-count">${rx.count}</span></div>`;
    });
    reactionsHtml += '</div>';
  }
  
  return `
  <div class="message-group ${mine ? 'own' : 'other'}">
    <div class="message-row ${mine ? 'own' : 'other'}" data-id="${msg.id}">
      <div class="msg-avatar-slot">
        <div class="msg-avatar ${avatarColor(senderName)}">${initials(senderName)}</div>
      </div>
      <div class="message-bubble">
        ${!mine && msg.sender_name ? `<div class="bubble-sender">${escHtml(senderName)}</div>` : ''}
        ${replyHtml}
        ${contentHtml}
        <div class="bubble-meta">
          <span class="bubble-time">${time}</span>
          ${reactionsHtml}
        </div>
      </div>
      ${mine ? '<div class="msg-avatar-slot"></div>' : ''}
    </div>
  </div>`;
}

// SEND MESSAGE
async function sendMessage() {
  const input = $('#message-input');
  const text = input.value.trim();
  
  if (!text || !currentChat) return;
  
  const action = currentChat.type === 'channel' ? 'send_channel_message' : 'send_message';
  const key = currentChat.type === 'channel' ? 'channel_id' : 'chat_id';
  
  const payload = {
    type: 'text',
    content: text,
    [key]: currentChat.id,
    reply_to_id: replyData ? replyData.id : null
  };
  
  input.value = '';
  clearReply();
  
  const data = await apiCall(action, payload);
  
  if (data.success) {
    await loadMessages();
  } else {
    showToast(data.error || 'Failed to send message', 'error');
    input.value = text;
  }
}

// File upload
async function onFile(input) {
  const file = input.files[0];
  if (!file || !currentChat) {
    input.value = '';
    return;
  }
  input.value = '';
  
  const formData = new FormData();
  formData.append('file', file, file.name);
  
  try {
    const uploadRes = await fetch('https://marya-hosting.pages.dev/btfstorage/upload', {
      method: 'POST',
      body: formData
    });
    const uploadData = await uploadRes.json();
    
    if (uploadData.success || uploadData.id) {
      const mediaUrl = uploadData.urls?.stream || 
        `https://marya-hosting.pages.dev/btfstorage/server/${uploadData.id}`;
      
      const fileType = file.type.startsWith('image/') ? 'image' :
                       file.type.startsWith('video/') ? 'video' : 'file';
      
      const action = currentChat.type === 'channel' ? 'send_channel_message' : 'send_message';
      const key = currentChat.type === 'channel' ? 'channel_id' : 'chat_id';
      
      const payload = {
        type: fileType,
        content: '',
        media_url: mediaUrl,
        media_name: file.name,
        [key]: currentChat.id,
        reply_to_id: replyData ? replyData.id : null
      };
      
      await apiCall(action, payload);
      await loadMessages();
    } else {
      showToast('Upload failed: ' + (uploadData.error || 'Unknown error'), 'error');
    }
  } catch(e) {
    showToast('Upload error: ' + e.message, 'error');
  }
}

// Reply
function clearReply() {
  replyData = null;
  $('#reply-bar').classList.add('hidden');
}

function setReply(id, text) {
  replyData = {id, text};
  $('#reply-bar').classList.remove('hidden');
  $('#reply-bar-sender').textContent = 'Replying to:';
  $('#reply-bar-text').textContent = text;
}

$('#cancel-reply-btn').addEventListener('click', clearReply);

// Reactions
async function reactToMessage(id, emoji) {
  const action = currentChat.type === 'channel' ? 'react_channel_message' : 'react_message';
  const data = await apiCall(action, {message_id: id, emoji});
  if (data.success) await loadMessages();
}

// Context menu (simplified)
let contextMenuData = null;
function showContextMenu(e, messageId, content, senderName, isMine) {
  const menu = $('#context-menu');
  contextMenuData = {id: messageId, content, senderName, isMine};
  
  // Position
  const x = e.clientX || e.touches?.[0]?.clientX || 0;
  const y = e.clientY || e.touches?.[0]?.clientY || 0;
  menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
  menu.style.top = `${Math.min(y, window.innerHeight - 200)}px`;
  menu.classList.remove('hidden');
  
  // Toggle delete visibility
  $('#ctx-delete').style.display = isMine ? 'block' : 'none';
  
  e.preventDefault();
}

function hideContextMenu() {
  $('#context-menu').classList.add('hidden');
  contextMenuData = null;
}

// Delete message
async function deleteMessage() {
  if (!contextMenuData || !contextMenuData.isMine) return;
  
  const action = currentChat.type === 'channel' ? 'delete_channel_message' : 'delete_message';
  const data = await apiCall(action, {message_id: contextMenuData.id});
  
  if (data.success) {
    showToast('Message deleted', 'info');
    await loadMessages();
  } else {
    showToast(data.error || 'Delete failed', 'error');
  }
  hideContextMenu();
}

// Context menu actions
$('#ctx-reply').addEventListener('click', () => {
  if (!contextMenuData) return;
  setReply(contextMenuData.id, contextMenuData.content);
  hideContextMenu();
});

$('#ctx-copy').addEventListener('click', async () => {
  if (!contextMenuData) return;
  await navigator.clipboard.writeText(contextMenuData.content || '');
  showToast('Copied to clipboard!', 'info');
  hideContextMenu();
});

$('#ctx-delete').addEventListener('click', deleteMessage);

// Emoji picker
function initEmojiPicker() {
  const picker = $('#emoji-picker');
  const toggle = $('#emoji-btn');
  
  toggle.addEventListener('click', () => {
    picker.classList.toggle('hidden');
    if (!picker.classList.contains('hidden')) {
      renderEmojiGrid();
    }
  });
  
  // Close when clicking outside
  document.addEventListener('click', (e) => {
    if (!picker.contains(e.target) && !toggle.contains(e.target)) {
      picker.classList.add('hidden');
    }
  });
}

function renderEmojiGrid() {
  const grid = $('#emoji-grid');
  const emojis = ['😊','😂','❤️','👍','🔥','😮','🎉','😢','👏','🙏','✅','💯','😍','🤔','👋','🎊','✨','💡','🤷‍♂️','🤦‍♀️'];
  
  grid.innerHTML = emojis.map(e => `<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('');
}

function insertEmoji(emoji) {
  const input = $('#message-input');
  const start = input.selectionStart;
  const end = input.selectionEnd;
  input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
  input.focus();
  
  const newPos = start + emoji.length;
  input.setSelectionRange(newPos, newPos);
}

// Attach menu
$('#attach-btn').addEventListener('click', toggleAttachMenu);
function toggleAttachMenu() {
  $('#attach-menu').classList.toggle('hidden');
}

$('#attach-image-btn').addEventListener('click', () => {
  $('#file-input').accept = 'image/*,video/*';
  $('#file-input').click();
  $('#attach-menu').classList.add('hidden');
});

$('#attach-file-btn').addEventListener('click', () => {
  $('#file-input').accept = '.pdf,.doc,.docx,.zip,.txt';
  $('#file-input').click();
  $('#attach-menu').classList.add('hidden');
});

$('#file-input').addEventListener('change', e => {
  if (e.target.files.length > 0) {
    onFile(e.target);
  }
});

// Bottom sheets
function initBottomSheets() {
  $$('[data-sheet]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sheetId = btn.getAttribute('data-sheet');
      closeSheet(sheetId);
    });
  });
  
  $('#bottom-sheet-overlay').addEventListener('click', () => {
    $$('.bottom-sheet:not(.hidden)').forEach(sheet => {
      if (!sheet.classList.contains('hidden')) {
        const sheetId = sheet.id;
        closeSheet(sheetId);
      }
    });
  });
}

function openSheet(sheetId) {
  if (sheetId === 'profile-sheet') {
    // Load profile data
    $('#profile-name-display').textContent = currentUser?.display_name || '';
    $('#profile-username-display').textContent = '@' + (currentUser?.username || '');
    $('#profile-display-name').value = currentUser?.display_name || '';
    
    if (currentUser?.avatar_url) {
      $('#profile-avatar-display').innerHTML = `<img src="${currentUser.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    }
  }
  
  $('#bottom-sheet-overlay').classList.remove('hidden');
  $(`#${sheetId}`).classList.remove('hidden');
}

function closeSheet(sheetId) {
  $(`#${sheetId}`).classList.add('hidden');
  $('#bottom-sheet-overlay').classList.add('hidden');
}

// Profile
$('#profile-btn').addEventListener('click', () => openSheet('profile-sheet'));
$('#save-profile-btn').addEventListener('click', saveProfile);
$('#logout-btn').addEventListener('click', logout);

async function saveProfile() {
  const displayName = $('#profile-display-name').value.trim();
  const bio = $('#profile-bio').value.trim();
  
  if (!displayName) {
    showToast('Display name is required', 'error');
    return;
  }
  
  const data = await apiCall('update_profile', {display_name: displayName, bio});
  
  if (data.success) {
    currentUser = {...currentUser, ...data.user};
    saveSession(currentUser);
    showToast('Profile updated!', 'success');
    closeSheet('profile-sheet');
  } else {
    showToast(data.error || 'Failed to update profile', 'error');
  }
}

// Logout
function logout() {
  currentUser = null;
  clearSession();
  showAuth();
  currentChat = null;
  currentChatId = null;
  chats = {};
  messages = {};
}

// Create new chat
$('#new-chat-btn').addEventListener('click', () => openSheet('new-chat-sheet'));

async function createNewChat() {
  const username = $('#new-chat-username').value.trim();
  if (!username) {
    showToast('Enter a username', 'error');
    return;
  }
  
  const data = await apiCall('create_chat', {is_group: false, peer_username: username});
  
  if (data.success) {
    showToast('Chat created!', 'success');
    closeSheet('new-chat-sheet');
    await loadChats();
    openChat(data.chat_id);
  } else {
    showToast(data.error || 'Failed to create chat', 'error');
  }
}

$('#create-chat-btn').addEventListener('click', createNewChat);

// Explore
$('#explore-btn').addEventListener('click', () => openSheet('explore-sheet'));

// Lightbox
function openLightbox(src) {
  const lb = $('#lightbox');
  $('#lightbox-img').src = src;
  $('#lightbox-img').classList.remove('hidden');
  $('#lightbox-video').classList.add('hidden');
  lb.classList.remove('hidden');
}

$('#lightbox-close').addEventListener('click', () => {
  $('#lightbox').classList.add('hidden');
});

// Utility functions
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Today';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {month: 'short', day: 'numeric'});
}

function avatarColor(name='') {
  const colors = ['av-blue','av-violet','av-teal','av-rose','av-orange','av-green','av-indigo','av-pink','av-amber','av-cyan'];
  let h = 0; for (const c of name) h = (h*31 + c.charCodeAt(0)) & 0xFFFF;
  return colors[h % colors.length];
}

function initials(name='') {
  return name.split(/\s+/).slice(0,2).map(w => w[0]||'').join('').toUpperCase() || '?';
}

function escHtml(s='') {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatFileSize(url) { // Can't actually get file size without HEAD request
  return url ? '📎' : '';
}
